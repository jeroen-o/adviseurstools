<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http://localhost:* https://localhost:*; form-action 'none'; base-uri 'none';">

<title>Berichtencentrum HDN-berichten</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bl:#0057B8;--dk:#0A1628;--bg:#F5F7FA;--wh:#fff;
  --br:#E0E7EF;--brl:#F0F4F8;
  --tx:#0A1628;--ts:#5A6A80;--th:#8A9BB0;
  --gn:#2E7D32;--gnb:#E8F5E9;
  --am:#F57F17;--amb:#FFF8E1;
  --rd:#C62828;--rdb:#FFEBEE;
  --ib:#E3F0FF;--r:8px;--rl:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
input,select,textarea{font-family:inherit;font-size:13px;padding:7px 10px;border:0.5px solid var(--br);border-radius:var(--r);background:var(--wh);color:var(--tx);width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--bl)}
textarea{resize:vertical;min-height:58px}
button{font-family:inherit;cursor:pointer;transition:opacity .15s}
button:active{opacity:.8}
label{font-size:12px;color:var(--ts);display:block;margin-bottom:3px}
.req::after{content:" *";color:var(--rd)}
a{color:var(--bl);text-decoration:none}
a:hover{text-decoration:underline}
.app{max-width:1040px;margin:0 auto;padding:0 20px 60px}
.hdr{background:var(--dk);color:white;padding:0 20px}
.hdr-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:14px 0 8px}
.logo{width:36px;height:36px;background:var(--bl);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:white;flex-shrink:0}
.hdr-tabs{max-width:1040px;margin:0 auto;display:flex;gap:0;overflow-x:auto}
.htab{background:none;border:none;color:#6B8CB8;border-bottom:2px solid transparent;padding:9px 16px;font-size:13px;font-weight:400;white-space:nowrap}
.htab.on{color:white;border-bottom-color:#00B4D8;font-weight:500}
.card{background:var(--wh);border-radius:var(--rl);border:0.5px solid var(--br);padding:16px 20px;margin-bottom:12px}
.card-t{font-size:14px;font-weight:500;margin-bottom:12px;padding-bottom:8px;border-bottom:0.5px solid var(--brl)}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;white-space:nowrap}
.b-blue{background:var(--ib);color:var(--bl)}
.b-green{background:var(--gnb);color:var(--gn)}
.b-amber{background:var(--amb);color:var(--am)}
.b-red{background:var(--rdb);color:var(--rd)}
.b-gray{background:var(--bg);color:var(--ts)}
.b-purple{background:#EDE7F6;color:#4A148C}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--bg);border-radius:var(--r);padding:11px 14px}
.sn{font-size:24px;font-weight:500}
.sl{font-size:11px;color:var(--th);margin-top:2px}
.mc{background:var(--wh);border-radius:var(--rl);border:0.5px solid var(--br);padding:13px 16px;margin-bottom:10px}
.ma{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{font-size:12px;padding:5px 13px;border:0.5px solid var(--br);border-radius:var(--r);background:var(--wh);color:var(--tx)}
.btn-p{background:var(--bl);color:white;border-color:var(--bl);font-size:13px;padding:8px 18px;border-radius:var(--r)}
.btn-s{background:var(--bl);color:white;border-color:var(--bl)}
.btn-w{background:var(--amb);color:var(--am);border-color:var(--am)}
.btn-d{color:var(--rd);border-color:var(--rd)}
.btn-g{color:var(--ts);border-color:var(--br)}
.btn-add{background:var(--ib);color:var(--bl);border:0.5px solid var(--bl);font-size:12px;padding:5px 12px;border-radius:var(--r)}
.btn-in{background:var(--gnb);color:var(--gn);border:0.5px solid var(--gn);font-size:12px;padding:5px 12px;border-radius:var(--r)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.fb{font-size:12px;padding:4px 12px;border:0.5px solid var(--br);border-radius:20px;background:var(--wh);color:var(--ts)}
.fb.on{background:var(--dk);color:white;border-color:var(--dk)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.ff{grid-column:1/-1}
.fn{font-size:10px;color:var(--am);margin-bottom:3px;margin-top:-2px}
.fi{font-size:10px;color:var(--th);margin-top:3px;font-family:monospace}
.fs{background:var(--wh);border-radius:var(--rl);border:0.5px solid var(--br);padding:15px 20px;margin-bottom:12px}
.ft{font-size:14px;font-weight:500;margin-bottom:13px;padding-bottom:7px;border-bottom:0.5px solid var(--brl)}
.ld-blk{background:var(--bg);border-radius:var(--r);border:0.5px solid var(--br);padding:13px 16px;margin-bottom:10px}
.hg-blk{background:var(--ib);border-radius:var(--r);border:0.5px solid #B3D4F5;padding:13px 16px;margin-bottom:10px}
.blk-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.blk-t{font-size:13px;font-weight:500;flex:1}
.jbox{background:var(--bg);border-radius:var(--r);padding:14px 16px;font-family:"Menlo","Monaco","Courier New",monospace;font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-all;overflow-x:auto;max-height:600px;overflow-y:auto}
.v-ok{background:var(--gnb);color:var(--gn);border-radius:var(--r);padding:8px 12px;font-size:12px;margin-bottom:8px}
.v-wn{background:var(--amb);color:var(--am);border-radius:var(--r);padding:8px 12px;font-size:12px;margin-bottom:8px}
.v-er{background:var(--rdb);color:var(--rd);border-radius:var(--r);padding:8px 12px;font-size:12px;margin-bottom:8px}
#notif{display:none;padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:12px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;padding-top:18px}
.tt{font-size:18px;font-weight:500}
.ts2{font-size:12px;color:var(--ts);margin-top:2px}
.empty{text-align:center;padding:40px 20px;color:var(--ts);font-size:14px;background:var(--bg);border-radius:var(--rl)}
.abar{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
.sep{height:0.5px;background:var(--brl);margin:16px 0}
.ltv-bar{height:8px;background:var(--br);border-radius:4px;margin:6px 0;overflow:hidden}
.ltv-fill{height:100%;border-radius:4px;transition:width .3s}
.dos-card{background:var(--wh);border-radius:var(--rl);border:0.5px solid var(--br);padding:14px 16px;margin-bottom:10px}
.dos-tl{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-left:3px solid var(--br);padding-left:12px;margin-bottom:6px}
.sx-badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--gnb);color:var(--gn)}
.blok-badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--rdb);color:var(--rd)}
.rv-badge{font-family:monospace;font-size:11px;background:var(--ib);color:var(--bl);padding:2px 7px;border-radius:4px}
.in-card{background:var(--gnb);border-radius:var(--rl);border:0.5px solid var(--gn);padding:13px 16px;margin-bottom:10px;opacity:.85}
.xmlbox{background:#1a1a2e;color:#e0e0e0;border-radius:var(--r);padding:14px 16px;font-family:monospace;font-size:11px;line-height:1.7;white-space:pre-wrap;word-break:break-all;overflow-x:auto;max-height:500px;overflow-y:auto}
.fld-err input,.fld-err select,.fld-err textarea{border-color:var(--rd)!important;background:var(--rdb)!important}
.fld-err label{color:var(--rd)!important}
.fld-err .fn{display:block}
.val-banner{background:var(--rdb);border:1px solid var(--rd);border-radius:var(--r);padding:12px 16px;margin-bottom:14px}
.val-banner-t{font-size:13px;font-weight:500;color:var(--rd);margin-bottom:8px}
.val-item{font-size:12px;color:var(--rd);padding:4px 0;border-bottom:0.5px solid rgba(198,40,40,0.2);display:flex;gap:8px;align-items:baseline}
.val-item:last-child{border-bottom:none}
.val-cert{font-weight:500;white-space:nowrap;min-width:140px}
@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .fg,.fg3{grid-template-columns:1fr}
  .ff{grid-column:1}
  .hdr-tabs{overflow-x:auto}
}
</style>
</head>

// ── HTML escape (XSS-preventie) ───────────────────────────────────────────
// Alle gebruikersdata die in innerHTML terechtkomt MOET via esc() lopen
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#x27;')
    .replace(/`/g,'&#x60;');
}
// Meerdere waarden escapen en samenvoegen
function escJoin(...parts){ return parts.map(esc).join(' ').trim(); }

function ts(){const n=new Date();return n.toLocaleDateString("nl-NL",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+n.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});}

function saveBer(){try{localStorage.setItem("hdn_v3_b",JSON.stringify(S.berichten));}catch(e){}}
function saveInbox(){try{localStorage.setItem("hdn_v3_i",JSON.stringify(S.inbox));}catch(e){}}

function load(){
  try{const d=localStorage.getItem("hdn_v3_b");if(d)S.berichten=JSON.parse(d);}catch(e){}

function allFlds(){
  let f=[];
  if(S.msgType==="AX"){
    for(let i=0;i<S.hgCount;i++){f=f.concat(hgF(i));f=f.concat(inkF(i));}
    for(let i=0;i<S.ldCount;i++){f=f.concat(ldF(i));}
    f=f.concat(FORMS.AX.static.flatMap(s=>s.f));
  } else if(FORMS[S.msgType]){
    f=FORMS[S.msgType].static.flatMap(s=>s.f);
  }
  return f;
}

function collectForm(){
  const data={};
  allFlds().forEach(f=>{const el=document.getElementById("fld_"+f.id);if(el)data[f.id]=el.value;});
  data._hgCount=S.hgCount;data._ldCount=S.ldCount;
  return data;
}

function validateF(data){return allFlds().filter(f=>f.r&&!data[f.id]).map(f=>f.l);}

function dossierId(b){return b.data?.dossier_ref||b.data?.leningnummer||b.naam||b.id;}

// Controleer of dossier geblokkeerd is (SX 16 of 20 ontvangen)
function isDossierGeblokkeerd(ref){
  return S.inbox.some(m=>m.type==="SX"&&m.data?.dossier_ref===ref&&SX_BLOKKEER.includes(m.data?.sx_code?.split(" – ")[0]));
}

function getRequestVersion(ref){
  const sent=S.berichten.filter(b=>dossierId(b)===ref).sort((a,b)=>b.id-a.id);
  return sent.length;
}

function saveMsg(status){
  const data=collectForm();
  const missing=status==="concept"?[]:validateF(data);
  if(missing.length){notif("Verplichte velden ontbreken: "+missing.slice(0,3).join(", ")+(missing.length>3?" en meer...":""),"w");return;}
  const aanb=document.getElementById("sel_aanb")?.value||S.aanbieder;
  const sp=document.getElementById("sel_sp")?.value||"";
  const naam=document.getElementById("sel_naam")?.value||(S.msgType+" → "+aanb);
  const dref=data.dossier_ref||data.leningnummer||"";
  if(dref&&isDossierGeblokkeerd(dref)){notif("Dossier geblokkeerd: SX 16 of SX 20 ontvangen. Geen berichten meer toegestaan.","w");return;}
  const t=ts();
  const rv=dref?getRequestVersion(dref)+1:1;
  if(S.editId){
    S.berichten=S.berichten.map(b=>b.id===S.editId?{...b,naam,aanbieder:aanb,sp,type:S.msgType,status,data,bijgewerkt:t,rv}:b);
    notif("Bijgewerkt","ok");
  } else {
    S.berichten.unshift({id:Date.now(),type:S.msgType,naam,aanbieder:aanb,sp,status,data,aangemaakt:t,bijgewerkt:t,rv});
    notif(status==="concept"?"Opgeslagen als concept":"Klaar voor versturen (nog niet verzonden)","ok");
  }
  saveBer();S.view="list";S.editId=null;render();
}

function directVersturen(){
  const data=collectForm();
  const missing=validateF(data);
  if(missing.length){notif("Verplichte velden ontbreken: "+missing.slice(0,3).join(", ")+(missing.length>3?" en meer...":""),"w");return;}
  const herrs=hardValidate(data,S.msgType,S.hgCount,S.ldCount);
  if(herrs.length){
    notif("Geblokkeerd: "+herrs.length+" certificeringsfout"+(herrs.length>1?"en":"")+" — zie rood in formulier","w");
    S.showValErrors=true;render();return;
  }
  const aanb=document.getElementById("sel_aanb")?.value||S.aanbieder;
  const sp=document.getElementById("sel_sp")?.value||"";
  const naam=document.getElementById("sel_naam")?.value||(S.msgType+"→"+aanb);
  const dref=data.dossier_ref||data.leningnummer||"";
  if(dref&&isDossierGeblokkeerd(dref)){notif("Dossier geblokkeerd: SX 16 of SX 20 ontvangen.","w");return;}
  const t=ts();const rv=dref?getRequestVersion(dref)+1:1;
  S.showValErrors=false;
  // Als API-modus aan staat: stuur via de Node.js server naar HDN
  if(S.apiModus && S.serverStatus){
    verstuurViaApi({
      id:Date.now(),type:S.msgType,naam,aanbieder:aanb,sp,
      data,aangemaakt:t,bijgewerkt:t,rv
    });
    return;
  }
  // Geen server verbonden: niets verzenden, bewaren als 'klaar'
  S.berichten.unshift({id:Date.now(),type:S.msgType,naam,aanbieder:aanb,sp,status:"klaar",data,aangemaakt:t,bijgewerkt:t,rv});
  saveBer();notif("Geen server verbonden — bericht NIET verzonden, bewaard als 'klaar'. Koppel een eigen server onder API-koppeling.","w");S.view="list";S.editId=null;render();
}

    return {requestVersion:rv,messageType:"OfferteAanvraag",receiverCode:rc,serviceproviderCode:b.sp||undefined,Hypotheekgever:hgs,Object:{Adres:{Straat:d.obj_straat,HuisNr:d.obj_huisnr,PostCode:d.obj_postcode,Woonplaats:d.obj_woonplaats},BAGID:d.bag_id||undefined,Koopsom:parseFloat(d.koopsom)||null,KoopsomGrond:parseFloat(d.koopsomgrond)||undefined,Aanneemsom:parseFloat(d.aanneemsom)||undefined,MarktWaarde:parseFloat(d.marktwaarde)||undefined,BouwJaar:parseInt(d.bouwjaar)||null,SoortWoning:d.woningtype,Energieklasse:d.energieklasse||undefined,TaxatieAanwezigJN:d.taxatieaanwezig?.charAt(0),TaxatieDt:d.taxatiedt||undefined,ErfpachtJN:d.erfpacht?.charAt(0),AfkoopErfpachtJN:d.afkooperfpacht?.charAt(0),Erfpacht:d.erfpacht?.charAt(0)==="J"?{EindDt:d.erfpachteinddatum,Canon:parseFloat(d.erfpachtcanon)||undefined}:undefined},Lening:{HypotheekBedrag:hb,Regeling:d.regeling?.split(" – ")[0],NHGJN:d.nhg?.charAt(0),IngebrachtEigenMiddelen:parseFloat(d.eigenmiddelen)||undefined,BestaandeHypotheekNr:d.besthydpnr||undefined,Arrangement:d.arrangement||undefined,Leningdelen:lds},Tussenpersoon:{AdviseurNr:d.adviseur_nr,IntermediairNr:d.intermediair_nr}};

function buildXML(b){
  const p=buildPayload(b);
  const clean=JSON.parse(JSON.stringify(p,(k,v)=>(v===null||v===undefined||v==="")?undefined:v));
  function toXML(obj,tag,indent){
    const i="  ".repeat(indent);
    if(typeof obj==="object"&&!Array.isArray(obj)){
      const inner=Object.entries(obj).map(([k,v])=>toXML(v,k,indent+1)).join("\n");
      return `${i}<${tag}>\n${inner}\n${i}</${tag}>`;
    } else if(Array.isArray(obj)){
      return obj.map(v=>toXML(v,tag,indent)).join("\n");
    } else {
      return `${i}<${tag}>${obj}</${tag}>`;
    }
  }
  return `<?xml version="1.0" encoding="UTF-8"?>\n${toXML(clean,b.type,0)}`;
}

function runValidations(d,ldC){
  const errs=[],warns=[];
  const hb=parseFloat(d.hypotheekbedrag)||0;
  let sumLd=0;for(let i=0;i<ldC;i++)sumLd+=parseFloat(d[`ld${i}_bedrag`])||0;
  if(hb>0&&sumLd>0&&Math.abs(hb-sumLd)>0.01)errs.push(`HypotheekBedrag (€${hb.toLocaleString("nl-NL")}) \u2260 som leningdelen (€${sumLd.toLocaleString("nl-NL")}) — KET-040`);
  const ks=parseFloat(d.koopsom)||0,kg=parseFloat(d.koopsomgrond)||0,as=parseFloat(d.aanneemsom)||0;
  if(kg>0&&as>0&&Math.abs(ks-(kg+as))>0.01)errs.push(`Koopsom (€${ks.toLocaleString("nl-NL")}) \u2260 KoopsomGrond + Aanneemsom — KET-006`);
  if(d.taxatieaanwezig?.charAt(0)==="J"&&d.taxatiedt&&new Date(d.taxatiedt)>=new Date())errs.push("TaxatieDt moet in het verleden liggen (cert. #8)");
  if(d.bron_check?.charAt(0)==="J")errs.push("DX NIET versturen: OpgevraagdViaBronJN=Ja (KET-026)");
  if(["04","06","08"].includes(d.doc_status?.split(" – ")[0]))errs.push("DX NIET versturen: documentstatus = "+d.doc_status);
  if(hb>0&&ks>0){const ltv=Math.round(hb/ks*100);if(ltv>106)warns.push(`LTV ${ltv}% — boven 106%`);else if(ltv>90)warns.push(`LTV ${ltv}% — boven 90%, check NHG-grens`);}
  return {errs,warns,hb,ks};
}

function hardValidate(data,msgType,hgCount,ldCount){
  const errs=[];
  if(msgType==="AX"){
    const hb=parseFloat(data.hypotheekbedrag)||0;
    const ldC=parseInt(ldCount)||1;
    const hgC=parseInt(hgCount)||1;
    let sumLd=0;
    for(let i=0;i<ldC;i++) sumLd+=parseFloat(data[`ld${i}_bedrag`])||0;
    if(hb>0&&sumLd>0&&Math.abs(hb-sumLd)>0.01)
      errs.push({cert:"Cert. #2 \u00b7 KET-040",msg:`HypotheekBedrag \u20ac${hb.toLocaleString("nl-NL")} \u2260 som leningdelen \u20ac${sumLd.toLocaleString("nl-NL")} (verschil: \u20ac${Math.abs(hb-sumLd).toLocaleString("nl-NL")})`});
    const ks=parseFloat(data.koopsom)||0,kg=parseFloat(data.koopsomgrond)||0,as=parseFloat(data.aanneemsom)||0;
    if(kg>0&&as>0&&Math.abs(ks-(kg+as))>0.01)
      errs.push({cert:"Cert. #3 \u00b7 KET-006",msg:`Koopsom \u20ac${ks.toLocaleString("nl-NL")} \u2260 KoopsomGrond (\u20ac${kg.toLocaleString("nl-NL")}) + Aanneemsom (\u20ac${as.toLocaleString("nl-NL")}) = \u20ac${(kg+as).toLocaleString("nl-NL")}`});
    for(let i=0;i<hgC;i++){
      const ibl=data[`hg${i}_ink_ibl`];
      const brutojaar=data[`hg${i}_ink_brutojaar`];
      if(ibl&&ibl.trim()&&brutojaar&&brutojaar.trim())
        errs.push({cert:"Cert. #4 \u00b7 KET-005/018",msg:`Hypotheekgever ${i+1}: IBL-bedrag EN BrutoJaarSalaris (DienstBetrekking) zijn allebei ingevuld — kies slechts \u00e9\u00e9n methode`});
      const gebdat=data[`hg${i}_geboortedatum`];
      const ingdat=data[`hg${i}_ink_ingdatum`];
      if(gebdat&&ingdat){
        if(new Date(ingdat)<new Date(gebdat))
          errs.push({cert:"Cert. #7",msg:`Hypotheekgever ${i+1}: IngangsDt dienstbetrekking (${ingdat}) ligt v\u00f3\u00f3r geboortedatum (${gebdat})`});
        const maxFut=new Date();maxFut.setFullYear(maxFut.getFullYear()+1);
        if(new Date(ingdat)>maxFut)
          errs.push({cert:"Cert. #7 (check)",msg:`Hypotheekgever ${i+1}: IngangsDt dienstbetrekking (${ingdat}) ligt meer dan 1 jaar in de toekomst — controleer`});
      }
    }
    if(data.taxatieaanwezig?.charAt(0)==="J"){
      if(!data.taxatiedt)
        errs.push({cert:"Cert. #8",msg:"TaxatieAanwezigJN = Ja maar TaxatieDt is niet ingevuld"});
      else if(new Date(data.taxatiedt)>=new Date())
        errs.push({cert:"Cert. #8",msg:`TaxatieDt (${data.taxatiedt}) moet in het verleden liggen`});
    }
  }
  if(msgType==="DX"){
    const docSt=data.doc_status?.split(" – ")[0];
    if(docSt==="04") errs.push({cert:"Cert. #5 \u00b7 KET-024",msg:"DocumentStatus = 04 Akkoord — DX versturen is niet toegestaan"});
    if(docSt==="08") errs.push({cert:"Cert. #5 \u00b7 KET-024",msg:"DocumentStatus = 08 Vervallen — DX versturen is niet toegestaan"});
    if(docSt==="06") errs.push({cert:"Cert. #6 \u00b7 KET-024",msg:"DocumentStatus = 06 Voorlopig Akkoord — DX versturen is niet toegestaan"});
    if(data.bron_check?.charAt(0)==="J") errs.push({cert:"Cert. #9 \u00b7 KET-026",msg:"OpgevraagdViaBronJN = Ja — DX versturen is niet toegestaan"});
  }
  return errs;
}

function updateLiveValidation(){
  const data=collectForm();
  const errs=hardValidate(data,S.msgType,S.hgCount,S.ldCount);
  const el=document.getElementById("live-val");
  if(!el) return;
  if(errs.length===0){
    el.innerHTML='<div class="v-ok" style="margin-bottom:0">Geen validatiefouten</div>';
    highlightErrFields([]);
    return;
  }
  el.innerHTML='<div class="val-banner"><div class="val-banner-t">Certificeringsblokkades ('+errs.length+') — los op voor je kunt versturen</div>'+errs.map(e=>'<div class="val-item"><span class="val-cert">'+esc(e.cert)+':</span><span>'+esc(e.msg)+'</span></div>').join("")+"</div>";
  highlightErrFields(errs);
}

// Markeer specifieke velden rood op basis van het cert-nummer
function highlightErrFields(errs){
  // Reset alle velden
  document.querySelectorAll(".fld-err").forEach(el=>el.classList.remove("fld-err"));
  if(!errs.length) return;
  const certs=errs.map(e=>e.cert);
  const hgC=S.hgCount||1;
  function markFld(id){const el=document.getElementById("fld_"+id);if(el&&el.parentElement)el.parentElement.classList.add("fld-err");}
  if(certs.some(c=>c.includes("#2")||c.includes("KET-040"))){
    markFld("hypotheekbedrag");
    for(let i=0;i<(S.ldCount||1);i++) markFld("ld"+i+"_bedrag");
  }
  if(certs.some(c=>c.includes("#3")||c.includes("KET-006"))){markFld("koopsom");markFld("koopsomgrond");markFld("aanneemsom");}
  if(certs.some(c=>c.includes("#4")||c.includes("KET-005"))){
    for(let i=0;i<hgC;i++){markFld("hg"+i+"_ink_ibl");markFld("hg"+i+"_ink_brutojaar");}
  }
  if(certs.some(c=>c.includes("#7"))){
    for(let i=0;i<hgC;i++){markFld("hg"+i+"_geboortedatum");markFld("hg"+i+"_ink_ingdatum");}
  }
  if(certs.some(c=>c.includes("#8"))){markFld("taxatieaanwezig");markFld("taxatiedt");}
  if(certs.some(c=>c.includes("#5")||c.includes("#6"))){markFld("doc_status");}
  if(certs.some(c=>c.includes("#9")||c.includes("KET-026"))){markFld("bron_check");}
}

async function verstuurViaApi(bericht){
  notif("Versturen naar HDN via API...","ok");
  const payload = JSON.parse(JSON.stringify(
    buildPayload(bericht),(k,v)=>(v===null||v===undefined||v==="")? undefined:v
  ));
  const t = ts();
  try {
    const verstuurHdrs={'Content-Type':'application/json'};
    if(S.apiToken) verstuurHdrs['Authorization']='Bearer '+S.apiToken;
    const r = await fetch(S.serverUrl+'/api/verstuur',{
      method:'POST',
      headers:verstuurHdrs,
      body: JSON.stringify({
        berichtType:  bericht.type,
        receiverCode: RCV[bericht.aanbieder]||bericht.aanbieder.toUpperCase().replace(/ /g,""),
        payload,
        dossiernaam:  bericht.naam,
      }),
      signal: AbortSignal.timeout(30000)
    });
    const data = await r.json();
    if(data.ok){
      const nieuwBericht = {
        ...bericht,
        status:"verstuurd",
        verstuurd_op:t,
        bijgewerkt:t,
        requestTraceNumber: data.requestTraceNumber||null,
      };
      if(bericht.id && S.berichten.some(b=>b.id===bericht.id)) {
        // Update bestaand
        S.berichten=S.berichten.map(b=>b.id===bericht.id?nieuwBericht:b);
      } else {
        S.berichten.unshift(nieuwBericht);
      }
      saveBer();
      notif("Verstuurd naar "+bericht.aanbieder+(data.requestTraceNumber?" — trace: "+esc(data.requestTraceNumber||""):""),"ok");
      S.view="list";S.editId=null;render();
    } else {
      if(data.code==='SESSIE_VERLOPEN'){
      notif("Sessie verlopen — voer API-token opnieuw in via API-configuratie tab","w");
      S.apiModus=false; S.view='api'; render(); return;
    }
    notif("HDN fout: "+(data.fout||data.error||"onbekende fout"),"w");
      // Sla op als concept zodat niets verloren gaat
      S.berichten.unshift({...bericht,status:"concept",aangemaakt:t,bijgewerkt:t});
      saveBer();render();
    }
  } catch(e){
    notif("Verbinding met server mislukt: "+e.message+" — opgeslagen als concept","w");
    S.berichten.unshift({...bericht,status:"concept",aangemaakt:t,bijgewerkt:t});
    saveBer();render();
  }
}

}

async function testServerVerbinding(){
  notif("Verbinding testen...","ok");
  try {
    const hdrs={'Content-Type':'application/json'};
    if(S.apiToken) hdrs['Authorization']='Bearer '+S.apiToken;
    if(!/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/i.test(S.serverUrl||'')) throw new Error('alleen een server op localhost is toegestaan');
    const r = await fetch(S.serverUrl+'/api/status',{headers:hdrs,signal:AbortSignal.timeout(5000)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    S.serverStatus = await r.json();
    notif("Verbinding met eigen server geslaagd","ok");
  } catch(e) {
    S.serverStatus = null; S.apiModus = false;
    notif("Geen server verbonden ("+S.serverUrl+"): "+e.message,"w");
  }
  render();
}

async function pollInkomend(types){
  if(!S.serverStatus){
    notif("Geen server verbonden — test eerst de verbinding onder API-koppeling","w");
    return;
  }
  try {
    const pollHdrs={'Content-Type':'application/json'};
    if(S.apiToken) pollHdrs['Authorization']='Bearer '+S.apiToken;
    const r = await fetch(S.serverUrl+'/api/poll',{
      method:'POST',
      headers:pollHdrs,
      body: JSON.stringify({berichtTypes:types}),
      signal: AbortSignal.timeout(15000)
    });
    const data = await r.json();
    const nieuw = data.nieuwAantal||0;
    S.lastPollResultaat = `${nieuw} nieuw bericht${nieuw!==1?'en':''} ontvangen (${new Date().toLocaleTimeString('nl-NL')})`;
    if(nieuw>0 && data.nieuweBerichten){
      // Voeg toe aan lokale inbox
      data.nieuweBerichten.forEach(b=>{
        const d=b.data||b;
        S.inbox.unshift({
          id:Date.now()+Math.random(),
          type:b.type,
          aanbieder:b.aanbieder||'HDN',
          data:{
            dossier_ref: d.requestTraceNumber||d.dossierId||'',
            sx_code:     d.statusCode?d.statusCode+' – '+(SX_CODES[d.statusCode]||''):'',
            tekst:       d.statusTekst||d.toelichting||'',
            ...d
          },
          ontvangen:new Date().toLocaleString('nl-NL')
        });
      });
      saveInbox();
    }
    render();
    if(nieuw>0) nav('inbox');
  } catch(e){
    notif("Poll mislukt: "+e.message,"w");
  }
}

    banner.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#0A1628;color:white;padding:14px 20px;font-size:13px;z-index:9999;display:flex;align-items:center;gap:16px;';
    banner.innerHTML=`<span>⚠️ <strong>AVG-melding:</strong> Dit programma slaat persoonsgegevens op in lokale browseropslag (localStorage), inclusief BSN-nummers. Gebruik uitsluitend op een beveiligde, beheerde werkplek.</span><button onclick="try{localStorage.setItem('${k}','1')}catch(e){};this.parentElement.remove()" style="background:#0057B8;border:none;color:white;padding:8px 16px;border-radius:6px;cursor:pointer;white-space:nowrap;font-size:12px;flex-shrink:0">Begrepen</button>`;
    document.body.appendChild(banner);
  }
}
