<!DOCTYPE html>
<html lang="nl">
<head>
<link rel="canonical" href="https://adviseurstools.nl/overige/pep-sanctielijst/" data-site>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--navy:#003057;--navy2:#0b4a7d;--gold:#e5a138;--gold-dk:#b97c14;--gold-lt:#fdf5e7;--bg:#f4f7f9;--white:#fff;--text:#1d2632;--muted:#5f6b7a;--border:#d1dce5;--green:#1a7f4b;--grlt:#e8f6ee;--red:#b42318;--redlt:#fdecea;--orange:#b45309;--orlt:#fef3c7;--shadow:0 2px 14px rgba(0,48,87,.08)}
        *,*::before,*::after{box-sizing:border-box}
        body { margin:0; font-family: Montserrat, Arial, Helvetica, sans-serif; font-size:15px; line-height:1.55; color:var(--text); background-color: var(--bg); padding: 16px; }
        .card { max-width: 520px; margin: 8px auto; background: var(--white); padding: 0 18px 16px; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); overflow:hidden; }
        .card > h3 { margin: 0 -18px 16px !important; background: var(--navy); color: #fff; padding: 12px 18px; font-size: 14px; font-weight: 700; }
        input { width: 100%; min-height: 40px; padding: 8px 10px; margin-bottom: 12px; border: 1.5px solid var(--border); border-radius: 7px; font-family: inherit; font-size: 15px; color: var(--text); background: #fff; outline: none; }
        input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(0,48,87,.12); }
        input::placeholder { color: var(--muted); }
        button { width: 100%; min-height: 42px; padding: 10px 16px; background: var(--gold); color: var(--navy); border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 700; }
        button:hover:not(:disabled) { background: var(--gold-dk); color: #fff; }
        #results { margin-top: 14px; font-size: 13px; }
        #results a { color: var(--navy2); }
        .status-red { padding: 10px 14px; background: var(--redlt); border-left: 4px solid var(--red); border-radius: 0 8px 8px 0; margin-bottom: 6px; }
        .status-green { padding: 10px 14px; background: var(--grlt); border-left: 4px solid var(--green); border-radius: 0 8px 8px 0; }
        .info { font-size: 11.5px; color: var(--muted); margin-top: 12px; }
        .avg { font-size: 12.5px; background: var(--gold-lt); border-left: 4px solid var(--gold); padding: 10px 14px; margin-bottom: 12px; border-radius: 0 8px 8px 0; line-height: 1.6; }
        .avg strong { color: var(--navy); }
        .avg label { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; cursor: pointer; font-weight: 600; color: var(--navy); }
        .avg input[type=checkbox] { width: 18px; height: 18px; min-height: 0; margin: 2px 0 0; flex-shrink: 0; accent-color: var(--navy); }
        button:disabled { background: #e3e9ef; color: var(--muted); cursor: not-allowed; }
        @media print { body { background:#fff; color:#000; } .card { box-shadow:none; } button { display:none; } }
    </style>
</head>
<body>

<div class="card">
    <h3 style="margin-top:0">PEP & Sanctie Check</h3>
    <input type="text" id="nameInp" placeholder="Voornaam Achternaam...">
    <div class="avg" id="avgMelding">
        <strong>Privacy (AVG):</strong> De ingevoerde naam wordt verstuurd naar OpenSanctions (externe dienst). Gebruik alleen als u daarvoor een grondslag heeft.
        <label><input type="checkbox" id="avgAkkoord" onchange="document.getElementById('checkBtn').disabled=!this.checked"> Ik heb een grondslag om deze naam door OpenSanctions te laten controleren.</label>
    </div>
    <button id="checkBtn" onclick="checkName()" disabled>Check Database</button>
    <div id="results"></div>
    <div class="info">Bron: OpenSanctions Open Database</div>
</div>

<script>
async function checkName() {
    const name = document.getElementById('nameInp').value;
    const resDiv = document.getElementById('results');
    if(!name) return;
    if(!document.getElementById('avgAkkoord').checked) {
        resDiv.innerHTML = "<p style='color:#b35c00;'>Vink eerst aan dat u een grondslag heeft om de naam naar OpenSanctions te versturen.</p>";
        return;
    }
    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    resDiv.innerHTML = "Laden...";

    try {
        // We voegen 'limit=5' toe en een simpele fetch
        const url = `https://api.opensanctions.org/search/default/?q=${encodeURIComponent(name)}&limit=3`;
        const response = await fetch(url);
        
        if (!response.ok) throw new Error("API Limiet of Blokkadde");
        
        const data = await response.json();

        if (data.results && data.results.length > 0) {
            let html = "<p>⚠️ <strong>Mogelijke match gevonden:</strong></p>";
            data.results.forEach(item => {
                html += `<div class="status-red">
                    <strong>${esc(item.caption)}</strong><br>
                    Rol: ${item.properties.topics ? esc(item.properties.topics[0]) : 'Politiek/Sanctie vermeld'}<br>
                    Land: ${item.properties.countries ? esc(item.properties.countries[0]) : 'Onbekend'}
                </div>`;
            });
            resDiv.innerHTML = html;
        } else {
            resDiv.innerHTML = "<div class='status-green'>✅ Geen directe resultaten gevonden voor deze naam.</div>";
        }
    } catch (err) {
        resDiv.innerHTML = "<p style='color:orange;'>De database is tijdelijk niet bereikbaar via deze browser. Gebruik de <a href='https://www.opensanctions.org/search/' target='_blank'>handmatige zoekmachine</a>.</p>";
    }
}
</script>
</body>
</html>
