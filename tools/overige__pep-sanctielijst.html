<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; background-color: #f9f9f9; padding: 15px; }
        .card { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #004a99; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #results { margin-top: 15px; font-size: 0.9em; }
        .status-red { padding: 10px; background: #fee; border-left: 4px solid #d9534f; margin-bottom: 5px; }
        .status-green { padding: 10px; background: #efe; border-left: 4px solid #5cb85c; }
        .info { font-size: 0.8em; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h3 style="margin-top:0">PEP & Sanctie Check</h3>
    <input type="text" id="nameInp" placeholder="Voornaam Achternaam...">
    <button onclick="checkName()">Check Database</button>
    <div id="results"></div>
    <div class="info">Bron: OpenSanctions Open Database</div>
</div>

<script>
async function checkName() {
    const name = document.getElementById('nameInp').value;
    const resDiv = document.getElementById('results');
    if(!name) return;

    resDiv.innerHTML = "Laden...";

    try {
        // We voegen 'limit=5' toe en een simpele fetch
        const url = `https://api.opensanctions.org/search/default/?q=${encodeURIComponent(name)}&limit=3`;
        const response = await fetch(url);
        
        if (!response.ok) throw new Error("API Limiet of Blokkadde");
        
        const data = await response.json();

        if (data.results && data.results.length > 0) {
            let html = "<p>⚠️ <strong>Mogelijke match gevonden:</strong></p>";
            data.results.forEach(item => {
                html += `<div class="status-red">
                    <strong>${item.caption}</strong><br>
                    Rol: ${item.properties.topics ? item.properties.topics[0] : 'Politiek/Sanctie vermeld'}<br>
                    Land: ${item.properties.countries ? item.properties.countries[0] : 'Onbekend'}
                </div>`;
            });
            resDiv.innerHTML = html;
        } else {
            resDiv.innerHTML = "<div class='status-green'>✅ Geen directe resultaten gevonden voor deze naam.</div>";
        }
    } catch (err) {
        resDiv.innerHTML = "<p style='color:orange;'>De database is tijdelijk niet bereikbaar via deze browser. Gebruik de <a href='https://www.opensanctions.org/search/' target='_blank'>handmatige zoekmachine</a>.</p>";
    }
}
</script>
</body>
</html>
