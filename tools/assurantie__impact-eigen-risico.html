<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eigen Risico Impact Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#003057;--navy2:#0b4a7d;--gold:#e5a138;--gold-dk:#b97c14;--gold-lt:#fdf5e7;
  --bg:#f4f7f9;--white:#fff;--text:#1d2632;--muted:#5f6b7a;--border:#d1dce5;
  --green:#1a7f4b;--grlt:#e8f6ee;--red:#b42318;--redlt:#fdecea;--orange:#b45309;--orlt:#fef3c7;
  --shadow:0 2px 14px rgba(0,48,87,.08);
  --font:Montserrat,Arial,Helvetica,sans-serif;
  /* oude namen -> lichte huisstijl */
  --bg2:#fff;--bg3:#f0f4f8;--border2:var(--border);
  --text2:#3b4757;--text3:var(--muted);
  --green-bg:var(--grlt);--green-border:var(--green);
  --red-bg:var(--redlt);--red-border:var(--red);
  --amber:var(--orange);--amber-bg:var(--orlt);--amber-border:var(--orange);
  --blue:var(--navy2);--blue-bg:#eef4fa;--accent:var(--navy);
  --r:12px;--r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.55;}

/* ── Header ── */
.header{background:var(--navy);color:#fff;padding:16px max(16px,calc((100% - 1148px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand-icon{width:40px;height:40px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.brand-name{font-size:20px;font-weight:700;color:#fff;line-height:1.25;}
.brand-sub{font-size:12.5px;color:rgba(255,255,255,.75);margin-top:2px;}
.print-btn{font-family:inherit;font-size:13px;font-weight:700;color:var(--navy);background:var(--gold);border:none;border-radius:8px;padding:9px 16px;cursor:pointer;transition:background .15s;}
.print-btn:hover{background:#d8922a;}

/* ── Layout ── */
.page{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:18px;align-items:start;}

/* ── Panel ── */
.panel{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
.panel-header{padding:11px 18px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;}
.panel-header h2{font-size:14px;font-weight:700;color:#fff;}
.panel-icon{font-size:15px;}
.panel-body{padding:16px 18px;}

/* ── Form fields ── */
.field{margin-bottom:18px;}
.field:last-child{margin-bottom:0;}
.field label{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.field label .val-display{text-transform:none;letter-spacing:0;font-size:15px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;}
.num-input-wrap{display:flex;align-items:center;background:#fff;border:1.5px solid var(--border);border-radius:7px;overflow:hidden;min-height:40px;transition:border-color .15s,box-shadow .15s;}
.num-input-wrap:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,48,87,.12);}
.num-btn{width:42px;align-self:stretch;background:#f0f4f8;border:none;color:var(--navy);font-size:18px;font-weight:700;cursor:pointer;padding:8px;font-family:inherit;transition:background .15s;user-select:none;line-height:1;}
.num-btn:hover{background:#e3e9ef;}
.num-input{flex:1;background:none;border:none;color:var(--text);font-family:inherit;font-size:15px;font-weight:700;text-align:center;outline:none;padding:8px 4px;min-width:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield;}
.slider-wrap{position:relative;}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:5px;background:#e3e9ef;border-radius:4px;outline:none;cursor:pointer;margin-top:10px;accent-color:var(--navy);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--gold);border-radius:50%;cursor:pointer;border:2px solid var(--navy);}
input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--gold);border-radius:50%;cursor:pointer;border:2px solid var(--navy);}
input[type=range]:focus-visible{box-shadow:0 0 0 3px rgba(0,48,87,.12);}
.slider-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px;}
.styled-select{width:100%;min-height:40px;background:#fff;border:1.5px solid var(--border);border-radius:7px;color:var(--text);font-family:inherit;font-size:15px;padding:8px 10px;outline:none;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.styled-select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,48,87,.12);}
.field-divider{height:1px;background:var(--border);margin:16px 0;}

/* ── Results column ── */
.results-col{display:flex;flex-direction:column;gap:14px;min-width:0;}
.verdict{border-radius:0 12px 12px 0;padding:18px 20px;border:1px solid var(--border);border-left:4px solid var(--navy2);background:#eef4fa;position:relative;overflow:hidden;}
.verdict.meld{background:var(--grlt);border-left-color:var(--green);}
.verdict.zelf{background:var(--redlt);border-left-color:var(--red);}
.verdict.twijfel{background:var(--orlt);border-left-color:var(--orange);}
.verdict.leeg{background:#fff;border-left-color:var(--gold);box-shadow:var(--shadow);}
.verdict-icon{font-size:28px;margin-bottom:8px;display:block;}
.verdict-label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px;}
.verdict.meld .verdict-label{color:var(--green);}
.verdict.zelf .verdict-label{color:var(--red);}
.verdict.twijfel .verdict-label{color:var(--orange);}
.verdict.leeg .verdict-label{color:var(--gold-dk);}
.verdict-title{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:6px;line-height:1.25;}
.verdict-body{font-size:13.5px;color:var(--text);line-height:1.65;}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.metric{background:#fff;border:1px solid var(--border);border-left:4px solid var(--navy);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);}
.metric-label{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.metric-value{font-size:22px;font-weight:800;line-height:1.2;color:var(--navy);font-variant-numeric:tabular-nums;}
.metric-value.green{color:var(--green);}
.metric-value.red{color:var(--red);}
.metric-value.amber{color:var(--orange);}
.metric-value.blue{color:var(--navy);}
.metric-value.muted{color:var(--muted);}
.metric-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.timeline-panel .panel-body{padding:0;}
.timeline-row{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--border);transition:background .15s;}
.timeline-row:nth-child(even){background:#f8fafc;}
.timeline-row:last-child{border-bottom:none;}
.timeline-row:hover{background:var(--gold-lt);}
.tl-year{font-size:12.5px;font-weight:700;color:var(--navy);width:50px;flex-shrink:0;}
.tl-bar-wrap{flex:1;height:8px;background:#e3e9ef;border-radius:4px;overflow:hidden;}
.tl-bar{height:100%;border-radius:4px;transition:width .5s ease;}
.tl-bar.cumverlies{background:var(--red);}
.tl-bar.voordeel{background:var(--green);}
.tl-amount{font-size:13px;font-weight:700;width:90px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;}
.tl-note{font-size:11px;color:var(--muted);width:90px;flex-shrink:0;text-align:right;}
.be-badge{display:inline-flex;align-items:center;gap:6px;background:var(--gold-lt);border:1px solid var(--gold);border-radius:20px;padding:3px 11px;font-size:11px;color:var(--navy);font-weight:700;margin-top:8px;}
.info-box{background:#eef4fa;border-left:4px solid var(--navy2);border-radius:0 8px 8px 0;padding:10px 14px;font-size:12.5px;color:var(--text);line-height:1.6;}
.info-box strong{color:var(--navy);}
.leeg-state{text-align:center;padding:40px 20px;color:var(--muted);}
.leeg-state .le-icon{font-size:40px;margin-bottom:12px;}
.leeg-state p{font-size:14px;line-height:1.6;}
@media (max-width:860px){.page{grid-template-columns:1fr;}}
@media (max-width:560px){.brand-name{font-size:17px;}.metrics{grid-template-columns:1fr 1fr;}.panel-body{padding:14px;}.timeline-row{padding:10px 14px;gap:10px;}.tl-note{width:70px;}}
@media print{.print-btn,.num-btn{display:none!important;}body{background:#fff;color:#000;}.header{background:#fff;border-bottom:2px solid #000;}.brand-name,.brand-sub{color:#000;}.panel,.metric,.verdict.leeg{box-shadow:none;}.panel-header{background:#fff;border-bottom:1px solid #000;}.panel-header h2{color:#000;}}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-icon">🧮</div>
    <div>
      <div class="brand-name">Eigen Risico Impact</div>
      <div class="brand-sub">Is schade melden financieel verstandig?</div>
    </div>
  </div>
  <button class="print-btn" onclick="window.print()">🖨️ Afdrukken</button>
</div>

<div class="page">

  <!-- Input panel -->
  <div>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-icon">⚙️</div>
        <h2>Vul uw situatie in</h2>
      </div>
      <div class="panel-body">

        <!-- Schadebedrag -->
        <div class="field">
          <label>Schadebedrag <span class="val-display" id="schadeDisplay">€ 0</span></label>
          <div class="num-input-wrap">
            <button class="num-btn" onclick="step('schade', -50)">−</button>
            <input type="number" class="num-input" id="schade" value="0" min="0" max="100000"
              oninput="update()" onchange="clamp('schade',0,100000)">
            <button class="num-btn" onclick="step('schade', 50)">+</button>
          </div>
          <input type="range" id="schadeSlider" min="0" max="10000" step="50" value="0"
            oninput="syncSlider('schade','schadeSlider',0,10000)">
          <div class="slider-labels"><span>€ 0</span><span>€ 5.000</span><span>€ 10.000+</span></div>
        </div>

        <!-- Eigen risico -->
        <div class="field">
          <label>Eigen risico <span class="val-display" id="erDisplay">€ 250</span></label>
          <div class="num-input-wrap">
            <button class="num-btn" onclick="step('er', -50)">−</button>
            <input type="number" class="num-input" id="er" value="250" min="0" max="5000"
              oninput="update()" onchange="clamp('er',0,5000)">
            <button class="num-btn" onclick="step('er', 50)">+</button>
          </div>
          <input type="range" id="erSlider" min="0" max="2500" step="50" value="250"
            oninput="syncSlider('er','erSlider',0,2500)">
          <div class="slider-labels"><span>€ 0</span><span>€ 1.250</span><span>€ 2.500</span></div>
        </div>

        <div class="field-divider"></div>

        <!-- Jaarpremie -->
        <div class="field">
          <label>Huidige jaarpremie <span class="val-display" id="premieDisplay">€ 600</span></label>
          <div class="num-input-wrap">
            <button class="num-btn" onclick="step('premie', -50)">−</button>
            <input type="number" class="num-input" id="premie" value="600" min="0" max="10000"
              oninput="update()" onchange="clamp('premie',0,10000)">
            <button class="num-btn" onclick="step('premie', 50)">+</button>
          </div>
          <input type="range" id="premieSlider" min="0" max="3000" step="50" value="600"
            oninput="syncSlider('premie','premieSlider',0,3000)">
          <div class="slider-labels"><span>€ 0</span><span>€ 1.500</span><span>€ 3.000</span></div>
        </div>

        <!-- No-claim korting -->
        <div class="field">
          <label>No-claimkorting verlies <span class="val-display" id="nclaimDisplay">10%</span></label>
          <input type="range" id="nclaim" min="0" max="40" step="5" value="10"
            oninput="update()">
          <div class="slider-labels"><span>0%</span><span>20%</span><span>40%</span></div>
        </div>

        <!-- Schadeverleden -->
        <div class="field">
          <label style="text-transform:uppercase;font-size:12.5px;font-weight:600;color:var(--navy);letter-spacing:.03em;margin-bottom:6px;display:block;">Herstelperiode no-claim</label>
          <select class="styled-select" id="herstel" onchange="update()">
            <option value="1">1 jaar — lichte schade</option>
            <option value="2" selected>2 jaar — gemiddeld</option>
            <option value="3">3 jaar — zware schade</option>
            <option value="4">4 jaar — meerdere schades</option>
            <option value="5">5 jaar — ernstige situatie</option>
          </select>
        </div>

        <div class="field-divider"></div>

        <!-- Verzekeringsvorm -->
        <div class="field">
          <label style="text-transform:uppercase;font-size:12.5px;font-weight:600;color:var(--navy);letter-spacing:.03em;margin-bottom:6px;display:block;">Type verzekering</label>
          <select class="styled-select" id="type" onchange="update()">
            <option value="inboedel">Inboedel / woonhuis</option>
            <option value="auto_wa" selected>Auto WA</option>
            <option value="auto_wa_bc">Auto WA + Beperkt Casco</option>
            <option value="auto_ar">Auto All-risk</option>
            <option value="aansprakelijkheid">Aansprakelijkheid (AVP)</option>
            <option value="overig">Overig</option>
          </select>
        </div>

      </div>
    </div>
  </div>

  <!-- Results column -->
  <div class="results-col" id="results">
    <div class="verdict leeg">
      <span class="verdict-icon">🧮</span>
      <div class="verdict-label">Wacht op invoer</div>
      <div class="verdict-title">Vul een schadebedrag in</div>
      <div class="verdict-body">Zodra u een schadebedrag invult, berekenen we direct of melden financieel verstandig is.</div>
    </div>
  </div>

</div>

<script>
function fmt(n) {
  return '€\u00a0' + Math.round(n).toLocaleString('nl-NL');
}

function step(id, delta) {
  const el = document.getElementById(id);
  el.value = Math.max(0, (parseFloat(el.value) || 0) + delta);
  update();
}

function clamp(id, min, max) {
  const el = document.getElementById(id);
  el.value = Math.min(max, Math.max(min, parseFloat(el.value) || 0));
  update();
}

function syncSlider(inputId, sliderId, min, max) {
  const val = parseFloat(document.getElementById(sliderId).value);
  document.getElementById(inputId).value = val;
  update();
}

function getVals() {
  return {
    schade:  parseFloat(document.getElementById('schade').value)  || 0,
    er:      parseFloat(document.getElementById('er').value)      || 0,
    premie:  parseFloat(document.getElementById('premie').value)  || 0,
    nclaim:  parseFloat(document.getElementById('nclaim').value)  || 0,
    herstel: parseInt(document.getElementById('herstel').value)   || 2,
    type:    document.getElementById('type').value,
  };
}

function update() {
  const v = getVals();

  // Sync sliders
  const schadeSlider = document.getElementById('schadeSlider');
  schadeSlider.value = Math.min(v.schade, 10000);
  const erSlider = document.getElementById('erSlider');
  erSlider.value = Math.min(v.er, 2500);
  const premieSlider = document.getElementById('premieSlider');
  premieSlider.value = Math.min(v.premie, 3000);

  // Display labels
  document.getElementById('schadeDisplay').textContent = fmt(v.schade);
  document.getElementById('erDisplay').textContent = fmt(v.er);
  document.getElementById('premieDisplay').textContent = fmt(v.premie);
  document.getElementById('nclaimDisplay').textContent = v.nclaim + '%';

  if (v.schade === 0) {
    document.getElementById('results').innerHTML = `
      <div class="verdict leeg">
        <span class="verdict-icon">🧮</span>
        <div class="verdict-label">Wacht op invoer</div>
        <div class="verdict-title">Vul een schadebedrag in</div>
        <div class="verdict-body">Zodra u een schadebedrag invult, berekenen we direct of melden financieel verstandig is.</div>
      </div>`;
    return;
  }

  // ── Core berekeningen ──
  const uitkering      = Math.max(0, v.schade - v.er);      // wat verzekeraar uitkeert
  const jaarlijksVerlies = v.premie * (v.nclaim / 100);     // extra premie per jaar
  const totaalVerlies  = jaarlijksVerlies * v.herstel;      // totaal premieverlies
  const nettoBaat      = uitkering - totaalVerlies;         // financieel voordeel melden
  const zelfdoenKosten = v.schade;                          // zelf betalen = volledige schade

  // Break-even schade: hoeveel schade moet er zijn zodat melden net loont
  const breakEvenSchade = v.er + totaalVerlies;

  // Terugverdientijd: hoe lang duurt het tot de uitkering de extra premie compenseert
  const terugverdien = jaarlijksVerlies > 0 ? uitkering / jaarlijksVerlies : 0;

  // ── Verdict ──
  let verdictClass, verdictIcon, verdictLabel, verdictTitle, verdictBody;

  if (v.schade <= v.er) {
    verdictClass = 'zelf';
    verdictIcon  = '🚫';
    verdictLabel = 'Niet zinvol om te melden';
    verdictTitle = 'Schade valt volledig binnen uw eigen risico';
    verdictBody  = `De schade (${fmt(v.schade)}) is lager dan of gelijk aan uw eigen risico (${fmt(v.er)}). De verzekeraar keert niets uit. U betaalt de schade het best zelf — plus u voorkomt een aantekening in uw schadeverleden.`;
  } else if (nettoBaat > 200) {
    verdictClass = 'meld';
    verdictIcon  = '✅';
    verdictLabel = 'Melden is financieel verstandig';
    verdictTitle = `Netto voordeel: ${fmt(nettoBaat)}`;
    verdictBody  = `De uitkering (${fmt(uitkering)}) weegt ruimschoots op tegen het verwachte premieverlies van ${fmt(totaalVerlies)} over ${v.herstel} jaar. Melden is in dit geval financieel de verstandige keuze.`;
  } else if (nettoBaat >= -200) {
    verdictClass = 'twijfel';
    verdictIcon  = '⚖️';
    verdictLabel = 'Twijfelgeval — weeg uw opties';
    verdictTitle = 'Financieel verschil is klein';
    verdictBody  = `Het nettoverschil tussen melden en zelf betalen is slechts ${fmt(Math.abs(nettoBaat))}. Overweeg ook niet-financiële factoren: uw schadeverleden, relatie met de verzekeraar en of u de schade zelf kunt veroorloven.`;
  } else {
    verdictClass = 'zelf';
    verdictIcon  = '💸';
    verdictLabel = 'Beter zelf betalen';
    verdictTitle = `Melden kost u netto ${fmt(Math.abs(nettoBaat))} extra`;
    verdictBody  = `Het verwachte premieverlies van ${fmt(totaalVerlies)} over ${v.herstel} jaar is hoger dan de uitkering van ${fmt(uitkering)}. U bent financieel beter af de schade zelf te betalen en uw no-claim te beschermen.`;
  }

  // ── Timeline data ──
  let timelineRows = '';
  let cumVerlies = 0;
  const maxBar = Math.max(uitkering, totaalVerlies, 1);

  for (let j = 1; j <= Math.max(v.herstel, 5); j++) {
    const isHerstelJaar = j <= v.herstel;
    cumVerlies += isHerstelJaar ? jaarlijksVerlies : 0;
    const nettoTotNu = uitkering - cumVerlies;
    const barPct = Math.min(100, (cumVerlies / maxBar) * 100);
    const kleur = nettoTotNu >= 0 ? 'var(--green)' : 'var(--red)';
    const prefix = nettoTotNu >= 0 ? '+' : '';
    const note = isHerstelJaar ? `${v.nclaim}% premie+` : 'no-claim hersteld';
    const noteColor = isHerstelJaar ? 'var(--red)' : 'var(--text3)';

    timelineRows += `
      <div class="timeline-row">
        <div class="tl-year">Jaar ${j}</div>
        <div class="tl-bar-wrap">
          <div class="tl-bar cumverlies" style="width:${barPct}%"></div>
        </div>
        <div class="tl-amount" style="color:${kleur}">${prefix}${fmt(nettoTotNu)}</div>
        <div class="tl-note" style="color:${noteColor}">${note}</div>
      </div>`;
  }

  // Break-even info
  const beText = v.schade > v.er
    ? `Break-even schadebedrag voor uw situatie: ${fmt(breakEvenSchade)}`
    : '';

  // Terugverdien tekst
  const tvText = uitkering > 0 && jaarlijksVerlies > 0
    ? terugverdien < 1
      ? 'Uitkering verdient premieverlies terug in minder dan 1 jaar'
      : `Uitkering verdient premieverlies terug na ${terugverdien.toFixed(1)} jaar`
    : '';

  document.getElementById('results').innerHTML = `

    <div class="verdict ${verdictClass}">
      <span class="verdict-icon">${verdictIcon}</span>
      <div class="verdict-label">${verdictLabel}</div>
      <div class="verdict-title">${verdictTitle}</div>
      <div class="verdict-body">${verdictBody}</div>
      ${beText ? `<div class="be-badge">🎯 ${beText}</div>` : ''}
    </div>

    <div class="metrics">
      <div class="metric">
        <div class="metric-label">Verwachte uitkering</div>
        <div class="metric-value ${uitkering > 0 ? 'green' : 'muted'}">${fmt(uitkering)}</div>
        <div class="metric-sub">Na aftrek eigen risico</div>
      </div>
      <div class="metric">
        <div class="metric-label">Premieverlies totaal</div>
        <div class="metric-value ${totaalVerlies > 0 ? 'red' : 'muted'}">${fmt(totaalVerlies)}</div>
        <div class="metric-sub">Over ${v.herstel} jaar · ${v.nclaim}%/jr</div>
      </div>
      <div class="metric">
        <div class="metric-label">Netto voordeel melden</div>
        <div class="metric-value ${nettoBaat > 0 ? 'green' : nettoBaat < 0 ? 'red' : 'amber'}">${nettoBaat >= 0 ? '+' : ''}${fmt(nettoBaat)}</div>
        <div class="metric-sub">Uitkering min premieverlies</div>
      </div>
      <div class="metric">
        <div class="metric-label">Zelf betalen kost</div>
        <div class="metric-value amber">${fmt(v.schade)}</div>
        <div class="metric-sub">Volledige schade, geen risico</div>
      </div>
    </div>

    <div class="panel timeline-panel">
      <div class="panel-header">
        <div class="panel-icon">📈</div>
        <h2>Netto positie per jaar (indien gemeld)</h2>
      </div>
      ${timelineRows}
    </div>

    <div class="info-box">
      ${tvText ? `<strong>⏱ ${tvText}.</strong><br>` : ''}
      <strong>Tip:</strong> Heeft u meerdere schades in korte tijd? Bedenk dan dat elke extra schade het premieverlies verder vergroot en de herstelperiode verlengt. Bij twijfel: vraag eerst een schadeschatting bij een vakman vóórdat u meldt.
    </div>
  `;
}

// Init
update();
</script>
</body>
</html>
