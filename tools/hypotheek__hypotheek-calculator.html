<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypotheek Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root{--navy:#003057;--navy2:#0b4a7d;--gold:#e5a138;--gold-dk:#b97c14;--gold-lt:#fdf5e7;--bg:#f4f7f9;--white:#fff;--text:#1d2632;--muted:#5f6b7a;--border:#d1dce5;--green:#1a7f4b;--grlt:#e8f6ee;--red:#b42318;--redlt:#fdecea;--orange:#b45309;--orlt:#fef3c7;--shadow:0 2px 14px rgba(0,48,87,.08)}
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0;font-family:Montserrat,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}
      .page{min-height:100vh;background:var(--bg)}
      .hdr{background:var(--navy);color:#fff;padding:16px}
      .hdr-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
      .hdr-title{font-size:20px;font-weight:700;color:#fff;line-height:1.25;margin:0}
      .hdr-sub{font-size:12.5px;color:rgba(255,255,255,.75);margin:2px 0 0}
      .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
      .card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
      .ch{background:var(--navy);color:#fff;padding:11px 18px;font-weight:700;font-size:14px;margin:0}
      .cb{padding:16px 18px}
      .sec-h{font-size:14px;font-weight:700;color:var(--navy);margin:0}
      .sep{font-size:10.5px;font-weight:700;color:var(--gold-dk);text-transform:uppercase;letter-spacing:.09em;padding-bottom:4px;border-bottom:1px solid var(--border);margin:0}
      .deel{border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;background:#fbfcfd}
      .deel h4{margin:0;font-size:13.5px;font-weight:700;color:var(--navy)}
      .fld-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
      .fld label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--navy);margin-bottom:4px}
      .inp{width:100%;min-height:40px;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-family:inherit;font-size:15px;color:var(--text);background:#fff;outline:none}
      .inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,48,87,.12)}
      .extra{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
      .btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:8px;padding:10px 16px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--gold);color:var(--navy)}
      .btn:hover{background:#d8942b}
      .btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy);padding:8px 14px;font-size:13px}
      .btn.sec:hover{background:#eef4fa}
      .btn.del{background:#fff;color:var(--red);border:1.5px solid var(--red);padding:4px 10px;font-size:12px}
      .btn.del:hover{background:var(--redlt)}
      .kpi-main{background:var(--gold-lt);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:10px;padding:14px 18px}
      .kpi-main h3{margin:0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
      .kpi-main p{margin:4px 0 0;font-size:26px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2}
      .empty{text-align:center;padding:24px 0;color:var(--muted)}
      .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
      table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
      table.t th{background:var(--navy);color:#fff;padding:7px 10px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;text-align:right;white-space:nowrap}
      table.t th:first-child{text-align:left}
      table.t td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
      table.t td:first-child{text-align:left}
      table.t tbody tr:nth-child(even) td{background:#f8fafc}
      table.t td.b{font-weight:700;color:var(--navy)}
      .uitleg h3{font-size:13.5px;font-weight:700;color:var(--navy);margin:0 0 2px}
      .uitleg p{font-size:13px;line-height:1.65;margin:0;color:var(--text)}
      .uitleg > div + div{margin-top:12px}
      @media(max-width:700px){.fld-grid{grid-template-columns:1fr 1fr}}
      @media(max-width:560px){.fld-grid{grid-template-columns:1fr}.hdr-title{font-size:17px}.cb{padding:14px}.kpi-main p{font-size:22px}}
      @media print{.noprint{display:none!important}body,.page{background:#fff;color:#000}.card{box-shadow:none}.hdr{background:#fff;color:#000;border-bottom:1px solid #000}.hdr-title,.hdr-sub{color:#000}}
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script>
        const { useState } = React;

        const fmt = (n) => n.toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        function App() {
            const [leningdelen, setLeningdelen] = useState([
                { id: 1, bedrag: '300000', rente: '4.5', looptijd: '30', type: 'annuitair' }
            ]);
            const [premie, setPremie] = useState('0');
            const [nextId, setNextId] = useState(2);

            const berekenAnnuitair = (deel) => {
                const P = parseFloat(deel.bedrag);
                const jaarRente = parseFloat(deel.rente) / 100;
                const maandRente = jaarRente / 12;
                const aantalMaanden = parseInt(deel.looptijd) * 12;
                if (maandRente === 0) return P / aantalMaanden;
                return P * (maandRente * Math.pow(1 + maandRente, aantalMaanden)) /
                       (Math.pow(1 + maandRente, aantalMaanden) - 1);
            };

            const berekenAflossingsvrij = (deel) => {
                const P = parseFloat(deel.bedrag);
                const jaarRente = parseFloat(deel.rente) / 100;
                return (P * jaarRente) / 12;
            };

            const berekenLineair = (deel) => {
                const P = parseFloat(deel.bedrag);
                const jaarRente = parseFloat(deel.rente) / 100;
                const aantalMaanden = parseInt(deel.looptijd) * 12;
                const aflossing = P / aantalMaanden;
                const eersteRente = (P * jaarRente) / 12;
                return aflossing + eersteRente;
            };

            const berekenMaandlast = (deel) => {
                if (parseFloat(deel.bedrag) <= 0 || parseFloat(deel.rente) < 0 || parseInt(deel.looptijd) <= 0) return 0;
                switch (deel.type) {
                    case 'annuitair': return berekenAnnuitair(deel);
                    case 'lineair': return berekenLineair(deel);
                    case 'aflossingsvrij': return berekenAflossingsvrij(deel);
                    default: return 0;
                }
            };

            const berekenTotalMaandlast = () => {
                return leningdelen.reduce((sum, deel) => sum + berekenMaandlast(deel), 0) + parseFloat(premie || 0);
            };

            const generateTable = () => {
                const aantalMaanden = Math.max(...leningdelen.map(d => parseInt(d.looptijd) * 12));
                const data = [];
                for (let i = 1; i <= aantalMaanden; i++) {
                    let maandlast = 0, totalRente = 0, totalAflossing = 0, totalRestschuld = 0;
                    leningdelen.forEach(deel => {
                        const P = parseFloat(deel.bedrag);
                        const jaarRente = parseFloat(deel.rente) / 100;
                        const maandRente = jaarRente / 12;
                        const aantalMaandenDeel = parseInt(deel.looptijd) * 12;
                        if (i <= aantalMaandenDeel) {
                            if (deel.type === 'aflossingsvrij') {
                                const ml = berekenAflossingsvrij(deel);
                                maandlast += ml; totalRente += ml; totalRestschuld += P;
                            } else if (deel.type === 'lineair') {
                                const aflossing = P / aantalMaandenDeel;
                                let restschuld = P;
                                for (let j = 1; j < i; j++) restschuld -= aflossing;
                                const renteAmount = restschuld * maandRente;
                                maandlast += aflossing + renteAmount;
                                totalRente += renteAmount; totalAflossing += aflossing;
                                totalRestschuld += Math.max(0, restschuld - aflossing);
                            } else {
                                const ml = berekenAnnuitair(deel);
                                let restschuld = P;
                                for (let j = 1; j < i; j++) {
                                    const ra = restschuld * maandRente;
                                    restschuld -= (ml - ra);
                                }
                                const renteAmount = restschuld * maandRente;
                                const aflossing = ml - renteAmount;
                                maandlast += ml; totalRente += renteAmount; totalAflossing += aflossing;
                                totalRestschuld += Math.max(0, restschuld - aflossing);
                            }
                        }
                    });
                    if (i % 12 === 0 || i === 1) {
                        data.push({
                            maand: i, maandlast: maandlast + parseFloat(premie || 0),
                            rente: totalRente, aflossing: totalAflossing,
                            restschuld: totalRestschuld, premie: parseFloat(premie || 0)
                        });
                    }
                }
                return data;
            };

            const addLending = () => {
                setLeningdelen([...leningdelen, { id: nextId, bedrag: '100000', rente: '4.5', looptijd: '30', type: 'annuitair' }]);
                setNextId(nextId + 1);
            };

            const removeLending = (id) => {
                if (leningdelen.length > 1) setLeningdelen(leningdelen.filter(d => d.id !== id));
            };

            const updateLending = (id, field, value) => {
                setLeningdelen(leningdelen.map(d => d.id === id ? { ...d, [field]: value } : d));
            };

            // ── Nieuwe printfunctie: opent een apart venster ──────────────────────
            // Werkt ook vanuit een Google Sites iframe omdat window.open()
            // altijd een nieuw top-level venster aanmaakt.
            const handlePrint = () => {
                const tableRows = generateTable();
                const totalMaandlast = berekenTotalMaandlast();

                const typeLabel = { annuitair: 'Annuïtair', lineair: 'Lineair', aflossingsvrij: 'Aflossingsvrij' };

                const leningTable = leningdelen.map((d, i) =>
                    `<tr>
                        <td>Lening ${i + 1}</td>
                        <td>${typeLabel[d.type]}</td>
                        <td>€ ${parseFloat(d.bedrag).toLocaleString('nl-NL', {minimumFractionDigits: 2})}</td>
                        <td>${d.rente}%</td>
                        <td>${d.looptijd} jaar</td>
                        <td>€ ${berekenMaandlast(d).toLocaleString('nl-NL', {minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                    </tr>`
                ).join('');

                const bodyRows = tableRows.map((row, idx) =>
                    `<tr class="${idx % 2 === 0 ? 'even' : ''}">
                        <td>${row.maand}</td>
                        <td>€ ${(row.maandlast - row.premie).toLocaleString('nl-NL', {minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                        <td>€ ${row.premie.toLocaleString('nl-NL', {minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                        <td>€ ${row.rente.toLocaleString('nl-NL', {minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                        <td>€ ${row.aflossing.toLocaleString('nl-NL', {minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                        <td>€ ${row.restschuld.toLocaleString('nl-NL', {minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                    </tr>`
                ).join('');

                const html = `<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Hypotheek Calculator – Overzicht</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; font-size: 12px; color: #1a1a1a; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: #555; margin-bottom: 20px; font-size: 13px; }
  h2 { font-size: 14px; margin: 20px 0 8px; border-bottom: 2px solid #003057; padding-bottom: 4px; color: #003057; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  th { background: #003057; color: white; text-align: left; padding: 6px 10px; font-size: 11px; }
  td { padding: 5px 10px; border-bottom: 1px solid #e5e7eb; }
  tr.even td { background: #f8fafc; }
  .total-box { background: #003057; color: white; padding: 14px 18px; border-radius: 8px;
               display: inline-block; margin-top: 8px; margin-bottom: 16px; }
  .total-box .label { font-size: 12px; opacity: .85; }
  .total-box .amount { font-size: 22px; font-weight: bold; margin-top: 2px; }
  @media print { body { padding: 12px; } }
</style>
</head>
<body>
<h1>🏠 Hypotheek Calculator</h1>
<p class="subtitle">Overzicht gegenereerd op ${new Date().toLocaleDateString('nl-NL', {day:'numeric',month:'long',year:'numeric'})}</p>

<h2>Leningdelen</h2>
<table>
  <thead><tr><th>#</th><th>Type</th><th>Bedrag</th><th>Rente</th><th>Looptijd</th><th>Maandlast</th></tr></thead>
  <tbody>${leningTable}</tbody>
</table>

<div class="total-box">
  <div class="label">Totale maandlast (incl. premie)</div>
  <div class="amount">€ ${totalMaandlast.toLocaleString('nl-NL', {minimumFractionDigits:2,maximumFractionDigits:2})}</div>
</div>

<h2>Maandelijks overzicht</h2>
<table>
  <thead><tr><th>Maand</th><th>Maandlast</th><th>Premie</th><th>Rente</th><th>Aflossing</th><th>Restschuld</th></tr></thead>
  <tbody>${bodyRows}</tbody>
</table>

<script>
  window.onload = function() { window.print(); };
<\/script>
</body>
</html>`;

                const win = window.open('', '_blank', 'width=900,height=700');
                if (win) {
                    win.document.write(html);
                    win.document.close();
                } else {
                    alert('Pop-ups zijn geblokkeerd. Sta pop-ups toe voor deze pagina om te kunnen afdrukken.');
                }
            };
            // ─────────────────────────────────────────────────────────────────────

            const isValid = leningdelen.some(d =>
                d.bedrag && d.rente && d.looptijd &&
                parseFloat(d.bedrag) > 0 && parseFloat(d.rente) >= 0 && parseInt(d.looptijd) > 0
            );

            return React.createElement('div', { className: 'page' },
                React.createElement('header', { className: 'hdr' },
                    React.createElement('div', { className: 'hdr-in' },
                        React.createElement('div', {},
                            React.createElement('h1', { className: 'hdr-title' }, 'Hypotheek Calculator'),
                            React.createElement('p', { className: 'hdr-sub' }, 'Bereken de maandlasten van verschillende hypotheekvormen')
                        )
                    )
                ),
                React.createElement('div', { className: 'wrap' },

                    React.createElement('div', { className: 'card cb' },
                        React.createElement('div', { className: 'flex justify-end mb-4 noprint' },
                            React.createElement('button', {
                                onClick: handlePrint,
                                className: 'btn'
                            },
                                React.createElement('svg', { className: 'w-4 h-4', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                                    React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4H9a2 2 0 00-2 2v2a2 2 0 002 2h4a2 2 0 002-2v-2a2 2 0 00-2-2zm0 0H7v4a2 2 0 002 2h4a2 2 0 002-2v-4' })
                                ),
                                'Afdrukken'
                            )
                        ),

                        React.createElement('div', { className: 'mb-6' },
                            React.createElement('div', { className: 'flex justify-between items-center mb-3 gap-2 flex-wrap' },
                                React.createElement('h3', { className: 'sec-h' }, 'Leningdelen'),
                                React.createElement('button', {
                                    onClick: addLending,
                                    className: 'btn sec'
                                }, '+ Lening toevoegen')
                            ),
                            React.createElement('div', { className: 'space-y-4' },
                                leningdelen.map((deel, idx) =>
                                    React.createElement('div', { key: deel.id, className: 'deel' },
                                        React.createElement('div', { className: 'flex justify-between items-center mb-3' },
                                            React.createElement('h4', {}, `Lening ${idx + 1}`),
                                            leningdelen.length > 1 && React.createElement('button', {
                                                onClick: () => removeLending(deel.id),
                                                className: 'btn del'
                                            }, 'Verwijderen')
                                        ),
                                        React.createElement('div', { className: 'fld-grid' },
                                            React.createElement('div', { className: 'fld' },
                                                React.createElement('label', { className: 'lbl' }, 'Type'),
                                                React.createElement('select', {
                                                    value: deel.type,
                                                    onChange: (e) => updateLending(deel.id, 'type', e.target.value),
                                                    className: 'inp'
                                                },
                                                    React.createElement('option', { value: 'annuitair' }, 'Annuïtair'),
                                                    React.createElement('option', { value: 'lineair' }, 'Lineair'),
                                                    React.createElement('option', { value: 'aflossingsvrij' }, 'Aflossingsvrij')
                                                )
                                            ),
                                            React.createElement('div', { className: 'fld' },
                                                React.createElement('label', { className: 'lbl' }, 'Bedrag (€)'),
                                                React.createElement('input', {
                                                    type: 'number', value: deel.bedrag,
                                                    onChange: (e) => updateLending(deel.id, 'bedrag', e.target.value),
                                                    className: 'inp',
                                                    placeholder: '100000'
                                                })
                                            ),
                                            React.createElement('div', { className: 'fld' },
                                                React.createElement('label', { className: 'lbl' }, 'Rente (%)'),
                                                React.createElement('input', {
                                                    type: 'number', step: '0.1', value: deel.rente,
                                                    onChange: (e) => updateLending(deel.id, 'rente', e.target.value),
                                                    className: 'inp',
                                                    placeholder: '4.5'
                                                })
                                            ),
                                            React.createElement('div', { className: 'fld' },
                                                React.createElement('label', { className: 'lbl' }, 'Looptijd (jaren)'),
                                                React.createElement('input', {
                                                    type: 'number', value: deel.looptijd,
                                                    onChange: (e) => updateLending(deel.id, 'looptijd', e.target.value),
                                                    className: 'inp',
                                                    placeholder: '30'
                                                })
                                            )
                                        )
                                    )
                                )
                            )
                        ),

                        React.createElement('div', { className: 'mb-6 extra' },
                            React.createElement('label', { className: 'lbl' }, 'Premie / Overige maandlasten (€)'),
                            React.createElement('input', {
                                type: 'number', step: '0.01', value: premie,
                                onChange: (e) => setPremie(e.target.value),
                                className: 'inp',
                                placeholder: '0'
                            })
                        ),

                        isValid && React.createElement('div', { className: 'kpi-main' },
                            React.createElement('div', { className: 'flex items-center gap-2' },
                                React.createElement('svg', { className: 'w-4 h-4', style: { color: 'var(--gold-dk)' }, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                                    React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z' })
                                ),
                                React.createElement('h3', {}, 'Totale maandlast')
                            ),
                            React.createElement('p', {}, '€ ' + fmt(berekenTotalMaandlast()))
                        ),

                        !isValid && React.createElement('div', { className: 'empty' },
                            React.createElement('p', {}, 'Vul alle velden in om de berekening te starten')
                        )
                    ),

                    isValid && React.createElement('div', { className: 'card' },
                        React.createElement('h3', { className: 'ch' }, 'Maandlijks overzicht'),
                        React.createElement('div', { className: 'cb tbl-wrap' },
                            React.createElement('table', { className: 't' },
                                React.createElement('thead', {},
                                    React.createElement('tr', {},
                                        React.createElement('th', {}, 'Maand'),
                                        React.createElement('th', {}, 'Maandlast'),
                                        React.createElement('th', {}, 'Premie'),
                                        React.createElement('th', {}, 'Rente'),
                                        React.createElement('th', {}, 'Aflossing'),
                                        React.createElement('th', {}, 'Restschuld')
                                    )
                                ),
                                React.createElement('tbody', {},
                                    generateTable().map((row, idx) =>
                                        React.createElement('tr', { key: idx },
                                            React.createElement('td', {}, row.maand),
                                            React.createElement('td', {}, '€ ' + fmt(row.maandlast - row.premie)),
                                            React.createElement('td', {}, '€ ' + fmt(row.premie)),
                                            React.createElement('td', {}, '€ ' + fmt(row.rente)),
                                            React.createElement('td', {}, '€ ' + fmt(row.aflossing)),
                                            React.createElement('td', { className: 'b' }, '€ ' + fmt(row.restschuld))
                                        )
                                    )
                                )
                            )
                        )
                    ),

                    React.createElement('div', { className: 'card' },
                        React.createElement('h2', { className: 'ch' }, 'Uitleg hypotheekvormen'),
                        React.createElement('div', { className: 'cb uitleg' },
                            React.createElement('div', {},
                                React.createElement('h3', {}, 'Annuïtaire hypotheek'),
                                React.createElement('p', {}, 'U betaalt elke maand hetzelfde bedrag. In het begin bestaat dit vooral uit rente, later betaalt u meer af op de hoofdsom.')
                            ),
                            React.createElement('div', {},
                                React.createElement('h3', {}, 'Aflossingsvrije hypotheek'),
                                React.createElement('p', {}, 'U betaalt alleen rente. De hoofdsom blijft gelijk en moet aan het einde van de looptijd in één keer worden afgelost.')
                            ),
                            React.createElement('div', {},
                                React.createElement('h3', {}, 'Lineaire hypotheek'),
                                React.createElement('p', {}, 'U lost elke maand hetzelfde bedrag af. Omdat de restschuld daalt, betaalt u steeds minder rente. De maandlast daalt dus elke maand.')

                )

        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
