function berekenAdvies(form) {
  // ── BLOKKEER: individuele benadering niet mogelijk bij algehele gemeenschap ──
  // Art. 1:94 BW: woning valt in gemeenschap → draagplichtovereenkomst heeft geen effect
  if (form.relatievorm === "gehuwd_gemeen") {
    return {
      factoren: [],
      totaal: 0,
      niveau: "Niet van toepassing",
      kleur: "green",
      geblokkeerd: true,
      advies: "Bij een huwelijk in algehele gemeenschap van goederen (art. 1:94 BW) valt de woning — en daarmee de hypotheekschuld — in de gemeenschap. Een interne draagplichtovereenkomst is dan juridisch niet effectief: de schulden zijn al 50/50 gemeenschappelijk van rechtswege. Individueel benaderen is hier niet mogelijk. Bespreek met de notaris of huwelijkse voorwaarden gewenst zijn als cliënten de draagplicht wél individueel willen regelen.",
      aanbevolenDocs: [],
    };
  }

  const factoren = [];
  const ev1 = parseFloat(form.eigenVermogen1) || 0;
  const ev2 = parseFloat(form.eigenVermogen2) || 0;

  // ── RELATIEVORM ──
  if (form.relatievorm === "ongehuwd") {
    factoren.push({ score: 3, kleur: "red", label: "Ongehuwde samenwoners (geen contract)", uitleg: "Wettelijke 50/50 draagplicht (art. 6:10 BW) geldt onverkort. Draagplichtovereenkomst is de enige manier om hiervan af te wijken." });
  }
  if (form.relatievorm === "samenwoners_contract") {
    factoren.push({ score: 2, kleur: "orange", label: "Samenwoners met samenlevingscontract", uitleg: "Een samenlevingscontract regelt doorgaans géén draagplicht. Een aanvullende draagplichtovereenkomst blijft noodzakelijk." });
  }
  if (form.relatievorm === "gehuwd_koude") {
    factoren.push({ score: 2, kleur: "orange", label: "Gehuwd op huwelijkse voorwaarden (koude uitsluiting)", uitleg: "Huwelijkse voorwaarden sluiten gemeenschap uit, maar regelen de interne draagplicht niet automatisch." });
  }
  if (form.relatievorm === "gehuwd_beperkt") {
    factoren.push({ score: 1, kleur: "orange", label: "Beperkte gemeenschap van goederen", uitleg: "Voorhuwelijkse schulden/bezittingen vallen buiten de gemeenschap. Controleer of de hypotheek in of buiten de gemeenschap valt." });
  }
  if (form.relatievorm === "geregistreerd") {
    factoren.push({ score: 2, kleur: "orange", label: "Geregistreerd partnerschap", uitleg: "Vergelijkbaar met huwelijk — bepaal of gemeenschap van goederen van toepassing is." });
  }

  // ── EIGEN VERMOGEN & VERJARING ──
  if (Math.abs(ev1 - ev2) > 500) {
    factoren.push({ score: 3, kleur: "red", label: "Ongelijke inbreng eigen vermogen", uitleg: `${ev1 > ev2 ? form.naam1 || "Aanvrager" : form.naam2 || "Partner"} brengt significant meer eigen geld in. Zonder overeenkomst zijn vergoedingsrechten moeilijk bewijsbaar.` });
  }
  // Verjaring: samenwoners — vordering verjaart na 5 jaar (art. 3:306 BW)
  if ((form.relatievorm === "ongehuwd" || form.relatievorm === "samenwoners_contract") && (ev1 > 500 || ev2 > 500)) {
    factoren.push({ score: 2, kleur: "red", label: "⏱️ Verjaringsrisico vergoedingsrecht (5 jaar — art. 3:306 BW)", uitleg: "Bij ongehuwde samenwoners verjaart een vordering uit vergoedingsrecht na 5 jaar (art. 3:306 BW), tenzij tijdig gestuit. Bij gehuwden loopt de verjaring niet tijdens het huwelijk. Overweeg een anti-verjaringsbeding (via notaris) of periodieke stuiting om het recht te bewaren." });
  }

  // ── EIGENWONINGVERLEDEN ──
  if (form.ewv1 || form.ewv2) {
    factoren.push({ score: 3, kleur: "red", label: "Eigenwoningverleden aanwezig", uitleg: "Verschillende renteaftrekperioden en EWR's dreigen fiscaal te 'mengen'. Zonder draagplichtovereenkomst kan dit leiden tot verlies van renteaftrekjaren." });
  }
  if (form.ewv1 && form.ewv2) {
    factoren.push({ score: 2, kleur: "red", label: "Beide partners hebben eigenwoningverleden", uitleg: "Dubbele complexiteit: twee eigenwoningverledens met mogelijk verschillende BEWS, EWR en resterende renteaftrekjaren." });
  }
  if (parseFloat(form.bews1 || 0) > 0 || parseFloat(form.bews2 || 0) > 0) {
    factoren.push({ score: 2, kleur: "red", label: "Overgangsrecht (BEWS) aanwezig", uitleg: "BEWS (art. 10bis.1 Wet IB 2001) geeft recht op aflossingsvrij lenen met renteaftrek. Moet per persoon worden toegepast of via de kan-bepaling gezamenlijk (onomkeerbaar)." });
  }

  // ── BOX 3 RISICO: EWR niet volledig ingebracht ──
  const K_b3 = (parseFloat(form.aankoopprijs) || 0) + (parseFloat(form.verwervingskosten) || 0);
  const H_b3 = form.leningdelen.reduce((s, l) => s + (parseFloat(l.bedrag) || 0), 0);
  if (K_b3 > 0 && H_b3 > 0) {
    [["1", form.naam1 || "Aanvrager"], ["2", form.naam2 || "Partner"]].forEach(([p, naam]) => {
      const ewr = parseFloat(form[`ewr${p}`] || 0);
      const bijleen = parseFloat(form[`afsstand${p}`] || 0);
      const eigendomPct = (parseFloat(p === "1" ? form.eigendom1 : form.eigendom2) || 50) / 100;
      const draagplicht = form.leningdelen.reduce((s, l) => s + (parseFloat(l.bedrag) || 0) * (parseFloat(p === "1" ? l.draag1 : l.draag2) || 50) / 100, 0);
      const maxEWS = Math.max(0, K_b3 * eigendomPct - ewr + bijleen);
      const box3Deel = Math.max(0, draagplicht - maxEWS);
      if (box3Deel > 1000) {
        factoren.push({ score: 3, kleur: "red", label: `🚫 Box 3-deel in hypotheek — ${naam} (€ ${Math.round(box3Deel).toLocaleString("nl-NL")},-)`, uitleg: `${naam} brengt de EWR niet volledig in. € ${Math.round(box3Deel).toLocaleString("nl-NL")},- van de hypotheek valt daardoor in box 3 — géén renteaftrek over dit deel. Bijleenregeling (art. 3.119aa Wet IB 2001): max aftrekbare EWS = verwervingskosten × eigendomsaandeel − EWR + bijleenstand = € ${Math.round(maxEWS).toLocaleString("nl-NL")},-.` });
      }
    });
  }

  // ── EIGENDOMSVERDELING ──
  const e1 = parseFloat(form.eigendom1) || 50;
  const e2 = parseFloat(form.eigendom2) || 50;
  if (Math.abs(e1 - e2) > 2) {
    factoren.push({ score: 2, kleur: "orange", label: "Ongelijke eigendomsverdeling", uitleg: `Eigendomsverdeling ${e1}/${e2} wijkt af van 50/50. Draagplicht dient hierop te worden afgestemd.` });
  }
  if (form.leningdelen.length > 1) {
    factoren.push({ score: 1, kleur: "blue", label: "Meerdere leningdelen", uitleg: "Expliciete toewijzing per leningdeel is nodig voor fiscale doelmatigheid en juridische helderheid." });
  }
  if (form.leningdelen.some(l => l.recht === "oud")) {
    factoren.push({ score: 2, kleur: "orange", label: "Overgangsrecht in leningdelen verwerkt", uitleg: "Leningdelen met oud recht (aflossingsvrij met renteaftrek) moeten expliciet worden toebedeeld aan de rechthebbende partner." });
  }
  if (form.context === "scheiding") {
    factoren.push({ score: 3, kleur: "red", label: "Scheidingscontext", uitleg: "Tijdelijke draagplichtafspraken nodig tot verkoop of overname. Gebruik specifieke scheidingsvariant overeenkomst." });
  }

  // ── TROUWEN — 4 GEVOLGEN ──
  if (form.trouwenPlannen && (form.relatievorm === "ongehuwd" || form.relatievorm === "samenwoners_contract")) {
    factoren.push({ score: 3, kleur: "red", label: "⚠️ Trouwplannen — 4 kritische gevolgen bij huwelijk zonder voorwaarden", uitleg: "(1) Draagplichtovereenkomst vervalt van rechtswege. (2) Alle leningdelen mengen naar de eigendomsverhouding (wettelijke regeling). (3) Volledige eigenwoningverleden van beide partners mengt, inclusief niet-toegepaste aflossingsstanden. (4) Nieuw toetsmoment nodig: hypotheek dient opnieuw beoordeeld te worden om te voorkomen dat delen naar box 3 verhuizen. Adviseer huwelijkse voorwaarden." });
  }

  // ── SCHENKBELASTING ──
  const H_sb = form.leningdelen.reduce((s, l) => s + (parseFloat(l.bedrag) || 0), 0);
  if (K_b3 > 0 && H_sb > 0) {
    const e1_sb = (parseFloat(form.eigendom1) || 50) / 100;
    const eerlijk1 = Math.max(0, K_b3 * e1_sb - ev1);
    const eerlijk2 = Math.max(0, K_b3 * (1 - e1_sb) - ev2);
    const D1_sb = form.leningdelen.reduce((s, l) => s + (parseFloat(l.bedrag) || 0) * (parseFloat(l.draag1) || 50) / 100, 0);
    const afwijking = Math.max(Math.abs(D1_sb - eerlijk1), Math.abs(H_sb - D1_sb - eerlijk2));
    if (afwijking > 6908) { // jaarlijkse schenkvrijstelling ouder-kind 2026
      const heeftRechtvaardiging = (form.ewv1 || form.ewv2) || Math.abs(ev1 - ev2) > 500;
      factoren.push({ score: heeftRechtvaardiging ? 1 : 3, kleur: heeftRechtvaardiging ? "orange" : "red", label: heeftRechtvaardiging ? "Schenkbelasting-risico (gemitigeerd)" : "⚠️ Mogelijk schenkbelasting-risico", uitleg: `De draagplicht wijkt € ${Math.round(afwijking).toLocaleString("nl-NL")},- af van de 'eerlijke' verdeling. ${heeftRechtvaardiging ? "Zakelijke rechtvaardiging aanwezig (EWV/ongelijke inbreng) — gedekt door Besluit 30-1-2018. Leg expliciet vast." : "Zonder zakelijke rechtvaardiging: risico op kwalificatie als schenking (art. 1 lid 1 sub f SW 1956). Bespreek met notaris. Zie tab Scenario's."}` });
    }
  }

  const totaal = factoren.reduce((s, f) => s + f.score, 0);
  let niveau, kleur, advies, aanbevolenDocs;

  if (totaal <= 3) {
    niveau = "Laag risico"; kleur = "green";
    advies = "Het risico is beperkt. Een draagplichtovereenkomst biedt echter altijd extra zekerheid bij toekomstige wijzigingen. Bespreek met cliënten.";
    aanbevolenDocs = ["draagplicht"];
  } else if (totaal <= 7) {
    niveau = "Aanbevolen"; kleur = "orange";
    advies = "Een draagplichtovereenkomst wordt sterk aanbevolen. Meerdere factoren zijn aanwezig die bij relatiebeëindiging tot discussie of verlies van belastingvoordeel kunnen leiden.";
    aanbevolenDocs = (Math.abs(ev1 - ev2) > 500) ? ["draagplicht", "vergoedingsrechten"] : ["draagplicht"];
  } else {
    niveau = "Noodzakelijk"; kleur = "red";
    advies = "Een draagplichtovereenkomst is noodzakelijk. Meerdere ernstige risicofactoren aanwezig. Zonder vastlegging dreigen verlies van renteaftrek, financiële claims en langdurige juridische geschillen.";
    aanbevolenDocs = (Math.abs(ev1 - ev2) > 500) ? ["draagplicht", "vergoedingsrechten"] : ["draagplicht"];
    if (form.context === "scheiding") aanbevolenDocs = ["scheiding"];
  }

  return { factoren, totaal, niveau, kleur, advies, aanbevolenDocs, geblokkeerd: false };
}

// DOCUMENT TEMPLATES (deterministisch, volledig lokaal — geen externe API)

const DOC_DISCLAIMER = "Model/concept — laat dit document controleren door een notaris of jurist voordat het wordt ondertekend.";
const DOC_SCHEIDER = "\n\n════════════════════════════════════════════════════════════\n\n";

function dNum(v) {
  if (v === null || v === undefined || v === "") return 0;
  const n = parseFloat(String(v).replace(",", "."));
  return isNaN(n) ? 0 : n;
}
function dEur(v) {
  return "€ " + dNum(v).toLocaleString("nl-NL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function dPct(v) {
  return dNum(v).toLocaleString("nl-NL", { maximumFractionDigits: 2 }) + "%";
}
function dDatum(iso) {
  if (!iso) return "……………………";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if (!m) return iso;
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return d.toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });
}
function dVandaag() {
  return new Date().toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });
}
function dPlaats(adres) {
  if (!adres) return "……………………";
  const delen = String(adres).split(",");
  let laatste = delen[delen.length - 1].trim();
  laatste = laatste.replace(/^\d{4}\s?[A-Za-z]{2}\s*/, "").trim();
  if (!laatste || delen.length < 2) return "……………………";
  return laatste.toLowerCase().split(" ").map(w => w.split("-").map(x => x ? x.charAt(0).toUpperCase() + x.slice(1) : x).join("-")).join(" ");
}
const D_RELATIE = {
  ongehuwd: "ongehuwd samenwonen en geen samenlevingscontract hebben gesloten",
  samenwoners_contract: "ongehuwd samenwonen en een samenlevingscontract hebben gesloten",
  gehuwd_koude: "met elkaar gehuwd zijn onder huwelijkse voorwaarden met uitsluiting van iedere gemeenschap van goederen (koude uitsluiting)",
  gehuwd_beperkt: "met elkaar gehuwd zijn in beperkte gemeenschap van goederen (wettelijk stelsel per 1 januari 2018)",
  gehuwd_gemeen: "met elkaar gehuwd zijn in algehele gemeenschap van goederen",
  geregistreerd: "een geregistreerd partnerschap met elkaar zijn aangegaan",
};
const D_SOORT = { "annuïtair": "annuïtaire lening", lineair: "lineaire lening", aflossingsvrij: "aflossingsvrije lening" };

function dPartijen(form) {
  const n1 = form.naam1 || "Aanvrager", n2 = form.naam2 || "Partner";
  const regel = (n, geb, bsn, nr) =>
    `${nr}. ${n}, geboren op ${dDatum(geb)}, BSN ${bsn || "……………………"}, wonende te ……………………,\n   hierna te noemen: "${n}";`;
  return `DE ONDERGETEKENDEN:\n\n${regel(n1, form.geb1, form.bsn1, 1)}\n\n${regel(n2, form.geb2, form.bsn2, 2).replace(/;$/, ",")}\n\nhierna gezamenlijk te noemen: "Partijen" en ieder afzonderlijk: "Partij".`;
}

function dOndertekening(form) {
  const n1 = form.naam1 || "Aanvrager", n2 = form.naam2 || "Partner";
  return `ONDERTEKENING

Aldus overeengekomen en in tweevoud opgemaakt en ondertekend,

te ${dPlaats(form.adres)}, op ${dVandaag()}.


______________________________          ______________________________
${n1.padEnd(40, " ")}${n2}
(handtekening)                          (handtekening)

Plaats: ……………………                         Plaats: ……………………
Datum:  ……………………                         Datum:  ……………………`;
}

// Maakt een artikel-teller zodat de nummering altijd doorloopt
function dArtikelen() {
  let nr = 0;
  const out = [];
  const sleutels = {};
  return {
    add(titel, tekst, sleutel) { nr += 1; if (sleutel) sleutels[sleutel] = nr; out.push(`Artikel ${nr} — ${titel}\n\n${tekst.trim()}`); return nr; },
    // {{art:sleutel}} wordt vervangen door het definitieve artikelnummer
    text() { return out.join("\n\n\n").replace(/\{\{art:(\w+)\}\}/g, (m, k) => sleutels[k] ? String(sleutels[k]) : "…"); },
  };
}

function dLeningData(form) {
  const ld = (form.leningdelen || []).map((l, i) => {
    const bedrag = dNum(l.bedrag);
    let p1 = l.draag1 === "" || l.draag1 === undefined ? NaN : dNum(l.draag1);
    let p2 = l.draag2 === "" || l.draag2 === undefined ? NaN : dNum(l.draag2);
    if (isNaN(p1) && isNaN(p2)) { p1 = 50; p2 = 50; }
    else if (isNaN(p1)) p1 = 100 - p2;
    else if (isNaN(p2)) p2 = 100 - p1;
    return { nr: i + 1, bedrag, soort: l.soort, recht: l.recht, p1, p2, b1: bedrag * p1 / 100, b2: bedrag * p2 / 100 };
  });
  const H = ld.reduce((s, l) => s + l.bedrag, 0);
  const D1 = ld.reduce((s, l) => s + l.b1, 0);
  const D2 = ld.reduce((s, l) => s + l.b2, 0);
  return { ld, H, D1, D2 };
}

function dLeningTabel(form, data) {
  const n1 = form.naam1 || "Aanvrager", n2 = form.naam2 || "Partner";
  const rijen = data.ld.map(l =>
    `Leningdeel ${l.nr}: ${dEur(l.bedrag)}
   Aflossingsvorm: ${D_SOORT[l.soort] || l.soort}
   Fiscaal regime: ${l.recht === "oud" ? "overgangsrecht (box 1, art. 10bis.1 Wet IB 2001)" : "nieuw recht (box 1, aflossingseis art. 3.119a Wet IB 2001)"}
   Draagplicht:    ${n1} ${dPct(l.p1)} (${dEur(l.b1)}) / ${n2} ${dPct(l.p2)} (${dEur(l.b2)})`);
  return rijen.join("\n\n") +
    `\n\nTotaal hypothecaire geldlening: ${dEur(data.H)}\n   Totale draagplicht ${n1}: ${dEur(data.D1)}${data.H > 0 ? ` (${dPct(data.D1 / data.H * 100)})` : ""}\n   Totale draagplicht ${n2}: ${dEur(data.D2)}${data.H > 0 ? ` (${dPct(data.D2 / data.H * 100)})` : ""}`;
}

function dWaarderingTekst(form) {
  const basis = form.waarderingsBasis || "nominaal";
  if (basis === "proportioneel") {
    return `De vordering wordt berekend volgens de beleggingsleer (vergelijk art. 1:87 lid 2 BW): de vordering deelt naar evenredigheid mee in de waardeverandering van de woning. De vordering bedraagt: het ingebrachte bedrag × (de waarde van de woning op het moment van opeisbaarheid ÷ de verkrijgingsprijs van de woning inclusief verwervingskosten). Partijen komen overeen dat de vordering bij waardedaling niet lager wordt dan het nominaal ingebrachte bedrag (bodemclausule), tenzij Partijen schriftelijk anders overeenkomen.`;
  }
  if (basis === "overleg") {
    return `Partijen hebben de waarderingsbasis van de vordering nog niet vastgesteld. Zij verplichten zich deze uiterlijk bij het passeren van de notariële akte schriftelijk vast te leggen (nominaal of volgens de beleggingsleer). Totdat dit is gebeurd, geldt de vordering als een nominale vordering. [NADER IN TE VULLEN IN OVERLEG MET DE NOTARIS]`;
  }
  return `De vordering is nominaal: zij is gelijk aan het ingebrachte bedrag, zonder vermeerdering met rente of waardestijging en zonder vermindering bij waardedaling van de woning.`;
}

function dVergoedingsBerekening(form) {
  const n1 = form.naam1 || "Aanvrager", n2 = form.naam2 || "Partner";
  const ev1 = dNum(form.eigenVermogen1), ev2 = dNum(form.eigenVermogen2);
  const e1 = form.eigendom1 === "" ? 50 : dNum(form.eigendom1);
  const tot = ev1 + ev2;
  const toerekening1 = tot * e1 / 100;
  const surplus1 = ev1 - toerekening1;
  if (tot <= 0 || Math.abs(surplus1) < 0.005) return { tot, ev1, ev2, crediteur: null, debiteur: null, bedrag: 0 };
  return surplus1 > 0
    ? { tot, ev1, ev2, crediteur: n1, debiteur: n2, bedrag: surplus1 }
    : { tot, ev1, ev2, crediteur: n2, debiteur: n1, bedrag: -surplus1 };
}

// ── DRAAGPLICHTOVEREENKOMST ──────────────────────────────────────────
function genereerDraagplicht(form, opties = {}) {
  const n1 = form.naam1 || "Aanvrager", n2 = form.naam2 || "Partner";
  const data = dLeningData(form);
  const e1 = form.eigendom1 === "" ? 50 : dNum(form.eigendom1);
  const e2 = form.eigendom2 === "" ? 100 - e1 : dNum(form.eigendom2);
  const koop = dNum(form.aankoopprijs), kk = dNum(form.verwervingskosten);
  const K = koop + kk;
  const ev1 = dNum(form.eigenVermogen1), ev2 = dNum(form.eigenVermogen2);
  const samenwoners = form.relatievorm === "ongehuwd" || form.relatievorm === "samenwoners_contract";
  const geldv = form.geldverstrekker || "……………………";
  const heeftOud = data.ld.some(l => l.recht === "oud");
  const bews1 = dNum(form.bews1), bews2 = dNum(form.bews2);
  const art = dArtikelen();

  const overw = [
    `Partijen ${D_RELATIE[form.relatievorm] || "samenwonen"};`,
    `Partijen de woning gelegen aan ${form.adres || "……………………"} (hierna: "de Woning") ${form.context === "oversluiting" ? "in eigendom hebben" : "in eigendom (zullen) verkrijgen"}, ieder voor een onverdeeld aandeel: ${n1} ${dPct(e1)} en ${n2} ${dPct(e2)};`,
    `de koopsom van de Woning ${dEur(koop)} bedraagt en de verwervingskosten ${dEur(kk)}, zodat de totale verwervingskosten ${dEur(K)} bedragen;`,
    `Partijen voor de financiering van de Woning gezamenlijk een hypothecaire geldlening (hierna: "de Lening") aangaan bij ${geldv} (hierna: "de Geldverstrekker") ter grootte van in totaal ${dEur(data.H)}, verdeeld over ${data.ld.length} leningde${data.ld.length === 1 ? "el" : "len"};`,
    `Partijen jegens de Geldverstrekker ieder hoofdelijk aansprakelijk zijn voor de volledige Lening;`,
  ];
  if (ev1 > 0 || ev2 > 0) overw.push(`Partijen eigen middelen inbrengen in de financiering van de Woning: ${n1} ${dEur(ev1)} en ${n2} ${dEur(ev2)};`);
  if (form.ewv1 || form.ewv2) overw.push(`${[form.ewv1 ? n1 : null, form.ewv2 ? n2 : null].filter(Boolean).join(" en ")} een eigenwoningverleden ${form.ewv1 && form.ewv2 ? "hebben" : "heeft"}, dat fiscaal bij de betreffende Partij moet blijven;`);
  overw.push(`Partijen in hun onderlinge verhouding (interne verhouding) willen vastleggen in welke mate ieder van hen de Lening en de daarmee samenhangende lasten draagt, zoals bedoeld in art. 6:10 BW, en welke gevolgen dit heeft voor aflossingen, renteaftrek en de verdeling bij beëindiging van de relatie;`);
  const overwTekst = "OVERWEGENDE DAT:\n\n" + overw.map((t, i) => `${String.fromCharCode(97 + i)}. ${t}`).join("\n") + "\n\nVERKLAREN TE ZIJN OVEREENGEKOMEN ALS VOLGT:";

  art.add("Definities", `In deze overeenkomst wordt verstaan onder:
a. Woning: de onroerende zaak gelegen aan ${form.adres || "……………………"}, met aanhorigheden;
b. Lening: de door Partijen bij de Geldverstrekker aangegane hypothecaire geldlening, met de leningdelen zoals omschreven in artikel 4;
c. Draagplicht: de mate waarin een Partij in de onderlinge verhouding tussen Partijen de schuld uit hoofde van een leningdeel, inclusief rente en aflossing, voor haar rekening neemt;
d. Hypotheeklasten: de periodiek verschuldigde rente en verplichte aflossing op de Lening;
e. Eigen middelen: vermogen van een Partij dat niet uit de Lening afkomstig is, zoals spaargeld, een schenking, een erfenis of de overwaarde van een vorige woning.`);

  art.add("Uitgangspunten: aankoop, kosten en financiering", `1. Partijen gaan bij het sluiten van deze overeenkomst uit van de volgende gegevens:

   Koopsom Woning:                 ${dEur(koop)}
   Verwervingskosten:              ${dEur(kk)}
   Totale verwervingskosten:       ${dEur(K)}

   Eigen middelen ${n1}:${" ".repeat(Math.max(1, 17 - n1.length))}${dEur(ev1)}

  art.add("Fiscale aspecten", `1. Het afzien van een vergoedingsrecht, of het niet vastleggen daarvan, kan worden aangemerkt als een schenking aan de andere Partij (art. 1 lid 1 Successiewet 1956), waarover schenkbelasting verschuldigd kan zijn.

  art.add("Overlijden", `Bij overlijden van een van Partijen vallen de vergoedingsrechten van en tegen de overledene in diens nalatenschap. Partijen zijn erop gewezen dat een testament of verblijvingsbeding gewenst kan zijn om de positie van de achterblijvende Partij te regelen.`);

  art.add("Wijziging en evaluatie", `Wijzigingen van deze overeenkomst zijn alleen geldig indien schriftelijk overeengekomen en door beide Partijen ondertekend. Partijen evalueren deze overeenkomst bij iedere wijziging van de financiering, iedere extra aflossing of investering, een wijziging van de relatievorm en verder ten minste eens per vijf jaar.`);

  art.add("Geschillen", `Partijen trachten geschillen eerst in onderling overleg of met behulp van een mediator op te lossen. Indien dat niet binnen drie maanden lukt, kan ieder van Partijen het geschil voorleggen aan de bevoegde rechter van de rechtbank in het arrondissement waarin de Woning is gelegen.`);

// ── DRAAGPLICHTOVEREENKOMST BIJ RELATIEBEËINDIGING ───────────────────
function genereerScheiding(form) {
  const n1 = form.naam1 || "Aanvrager", n2 = form.naam2 || "Partner";
  const data = dLeningData(form);
  const e1 = form.eigendom1 === "" ? 50 : dNum(form.eigendom1);
  const e2 = form.eigendom2 === "" ? 100 - e1 : dNum(form.eigendom2);
  const ev1 = dNum(form.eigenVermogen1), ev2 = dNum(form.eigenVermogen2);
  const geldv = form.geldverstrekker || "……………………";
  const gehuwd = ["gehuwd_koude", "gehuwd_beperkt", "gehuwd_gemeen", "geregistreerd"].includes(form.relatievorm);
  const art = dArtikelen();

  const overw = [
    `Partijen ${D_RELATIE[form.relatievorm] || "samenwonen"};`,
    `Partijen hebben besloten hun relatie te beëindigen${gehuwd ? " en de ontbinding van hun huwelijk of geregistreerd partnerschap (zullen) verzoeken" : ""};`,
    `Partijen gezamenlijk eigenaar zijn van de woning gelegen aan ${form.adres || "……………………"} (hierna: "de Woning"), ieder voor een onverdeeld aandeel: ${n1} ${dPct(e1)} en ${n2} ${dPct(e2)};`,
    `op de Woning een hypothecaire geldlening rust bij ${geldv} (hierna: "de Geldverstrekker") van in totaal ${dEur(data.H)} (hierna: "de Lening"), waarvoor Partijen hoofdelijk aansprakelijk zijn;`,
    `Partijen voor de periode tot de verkoop of overname van de Woning tijdelijke afspraken willen maken over de draagplicht en de betaling van de lasten;`,
  ];
  const overwTekst = "OVERWEGENDE DAT:\n\n" + overw.map((t, i) => `${String.fromCharCode(97 + i)}. ${t}`).join("\n") + "\n\nVERKLAREN TE ZIJN OVEREENGEKOMEN ALS VOLGT:";

  art.add("Looptijd", `1. Deze overeenkomst geldt vanaf de dag van ondertekening tot het eerste van de volgende momenten:
   a. de levering van de Woning aan een derde en de aflossing van de Lening;
   b. de levering van het aandeel van de ene Partij aan de andere Partij (overname), mits de vertrekkende Partij door de Geldverstrekker uit de hoofdelijke aansprakelijkheid is ontslagen;
   c. een andere datum die Partijen schriftelijk overeenkomen.

2. Partijen streven ernaar de Woning uiterlijk op ……………………… te verkopen of te laten overnemen. [DATUM IN TE VULLEN]`);

  art.add("Tijdelijke draagplicht per leningdeel", `1. Gedurende de looptijd van deze overeenkomst draagt ieder van Partijen de Lening in hun onderlinge verhouding als volgt:

${dLeningTabel(form, data)}

2. Deze tijdelijke draagplicht vervangt voor de looptijd eerdere afspraken over de draagplicht, voor zover daarmee strijdig.`);

  art.add("Betalingsafspraken hypotheeklasten", `1. Gedurende de looptijd worden de rente en verplichte aflossing op de Lening voldaan door: ……………………… [NAAM IN TE VULLEN] / beide Partijen naar rato van de draagplicht.

2. De Partij die de Woning blijft bewonen (……………………… [NAAM IN TE VULLEN]) draagt de gebruikslasten (energie, water, gemeentelijke heffingen voor gebruikers) en het gewone onderhoud.

3. De eigenaarslasten (opstalverzekering, onroerendezaakbelasting eigenarendeel, waterschapslasten gebouwd, groot onderhoud) worden gedragen naar rato van de eigendomsverhouding.

4. Iedere Partij verplicht zich de Geldverstrekker tijdig te betalen. Een Partij die een betalingsachterstand dreigt, meldt dit onmiddellijk aan de andere Partij.`);

  art.add("Verrekening", `1. Indien een Partij gedurende de looptijd meer betaalt dan waartoe zij op grond van artikel 2 en 3 gehouden is, heeft zij voor het meerdere een vordering op de andere Partij.

2. Indien de bewonende Partij een gebruiksvergoeding verschuldigd is voor het gebruik van het aandeel van de andere Partij, bedraagt deze ……………………… per maand [IN TE VULLEN of: "Partijen komen overeen dat geen gebruiksvergoeding verschuldigd is"].

3. Over en weer bestaande vorderingen worden verrekend bij de verkoop of overname van de Woning, uit de netto-opbrengst of bij de afrekening van de overnamesom.`);

  art.add("Hoofdelijke aansprakelijkheid", `1. Deze overeenkomst werkt uitsluitend tussen Partijen. De Geldverstrekker kan ieder van Partijen voor de volledige Lening blijven aanspreken, zolang de Lening op beider naam staat en geen ontslag uit de hoofdelijke aansprakelijkheid is verleend.

2. Een Partij die door de Geldverstrekker wordt aangesproken voor meer dan haar draagplicht, heeft voor het meerdere regres op de andere Partij (art. 6:10 BW).`);

  art.add("Fiscale gevolgen", `1. De renteaftrek volgt de draagplicht, voor zover de schuld kwalificeert als eigenwoningschuld. Partijen zijn erop gewezen dat de Woning voor de vertrekkende Partij onder voorwaarden nog ten hoogste twee jaar na het verlaten als eigen woning kan gelden (art. 3.111 lid 3 Wet IB 2001), en dat de renteaftrek daarna voor die Partij vervalt.

2. Een afwijking van de draagplicht ten opzichte van de eigendomsverhouding zonder zakelijke rechtvaardiging kan als schenking worden aangemerkt. Tijdelijke afspraken in het kader van de beëindiging van de relatie worden geacht zakelijk te zijn, mits zij worden verrekend overeenkomstig artikel 4.

3. Het fiscale eigenwoningverleden van iedere Partij blijft bij die Partij. Bij verkoop kan voor iedere Partij een eigenwoningreserve ontstaan.`);

  art.add("Verkoop of overname", `1. Bij verkoop wordt de netto-opbrengst eerst aangewend tot aflossing van de Lening. Het restant wordt verdeeld naar de eigendomsverhouding, vermeerderd of verminderd met de vorderingen uit artikel 4 en de vergoedingsrechten uit artikel 8.

2. Een restschuld wordt gedragen naar rato van de draagplicht per leningdeel. Partijen maken over de aflossing daarvan nadere schriftelijke afspraken.

3. Bij overname door één Partij wordt de overnamesom bepaald op basis van een door Partijen gezamenlijk aangewezen gecertificeerd taxateur. De overnemende Partij draagt zorg voor ontslag van de vertrekkende Partij uit de hoofdelijke aansprakelijkheid; lukt dit niet binnen ……… maanden, dan wordt de Woning verkocht.`);

  art.add("Eigen middelen en vergoedingsrechten", `1. De bij de aankoop ingebrachte eigen middelen bedroegen: ${n1} ${dEur(ev1)} en ${n2} ${dEur(ev2)}.

2. Waarderingsbasis van vergoedingsrechten: ${dWaarderingTekst(form)}

3. Bestaande vergoedingsrechten worden afgerekend bij verkoop of overname, voordat het restant naar de eigendomsverhouding wordt verdeeld.`);

  art.add("Overlijden", `Bij overlijden van een van Partijen gedurende de looptijd gelden de rechten en verplichtingen uit deze overeenkomst voor en tegen diens erfgenamen.`);

  if (form.bijzonderheden && form.bijzonderheden.trim()) {
    art.add("Bijzondere afspraken", form.bijzonderheden.trim());
  }

  art.add("Geschillen", `Partijen trachten geschillen eerst met behulp van een mediator op te lossen. Indien dat niet binnen twee maanden lukt, kan ieder van Partijen het geschil voorleggen aan de bevoegde rechter van de rechtbank in het arrondissement waarin de Woning is gelegen.`);

  art.add("Slotbepalingen", `1. Op deze overeenkomst is Nederlands recht van toepassing.

2. Wijzigingen zijn alleen geldig indien schriftelijk overeengekomen en door beide Partijen ondertekend.

3. Indien een bepaling nietig is of wordt vernietigd, blijven de overige bepalingen van kracht.

4. Partijen verklaren dat zij de inhoud en gevolgen van deze overeenkomst begrijpen, dat zij zich onafhankelijk hebben kunnen laten adviseren en dat zij haar vrijwillig aangaan.${gehuwd ? "\n\n5. Deze overeenkomst kan worden opgenomen in of gevoegd bij het echtscheidings- of ontbindingsconvenant." : ""}`);

  return `${DOC_DISCLAIMER}

DRAAGPLICHTOVEREENKOMST BIJ RELATIEBEËINDIGING
tijdelijke afspraken tot verkoop of overname van de woning aan ${form.adres || "……………………"}


${dPartijen(form)}


${overwTekst}


${art.text()}


${dOndertekening(form)}`;
}

function genereerDocument(docType, form) {
  if (docType === "vergoedingsrechten") return genereerVergoedingsrechten(form);
  if (docType === "scheiding") return genereerScheiding(form);
  if (docType === "beide") return genereerDraagplicht(form, { metVergoedingsovereenkomst: true }) + DOC_SCHEIDER + genereerVergoedingsrechten(form);
  return genereerDraagplicht(form);
}

function CopyBtn({ text }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    const doCopy = () => {
      // Fallback for cross-origin iframes (Google Sites) where clipboard API is blocked
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0";
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        setCopied(true);
        setTimeout(() => setCopied(false), 2200);
      } catch (e2) {
        alert("Kopiëren mislukt. Selecteer de tekst handmatig.");
      }
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => {
        setCopied(true); setTimeout(() => setCopied(false), 2200);
      }).catch(doCopy);
    } else {
      doCopy();
    }
  };
  return <button onClick={copy} style={{ ...btnSm, background: copied ? C.greenLight : C.grayLight, color: copied ? C.green : C.navy, border: `1px solid ${copied ? C.green : C.border}` }}>{copied ? "✓ Gekopieerd" : "📋 Kopieer"}</button>;
}

        <svg viewBox="0 0 88 88">
          <circle cx="44" cy="44" r="34" fill="none" stroke={C.grayMid} strokeWidth="9" />
          <circle cx="44" cy="44" r="34" fill="none" stroke={kleur} strokeWidth="9"
            strokeDasharray={`${2 * Math.PI * 34 * pct / 100} ${2 * Math.PI * 34}`}
            strokeLinecap="round" transform="rotate(-90 44 44)"

        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>

  );
}

          {[

            ["3", "Volledig eigenwoningverleden van beide partners mengt", "Inclusief niet-toegepaste aflossingsstanden, resterende renteaftrekjaren en BEWS. Dit kan niet worden teruggedraaid."],
            ["4", "Nieuw toetsmoment vereist — risico op box 3", "Hypotheek dient opnieuw beoordeeld te worden om te voorkomen dat delen naar box 3 verhuizen (geen renteaftrek)."],

function Stap2({ form, up }) {

  const e2 = 100 - e1;
  return (
    <div>
      <SectionH sub="Hoeveel procent van de woning heeft iedere partner juridisch in eigendom?">Stap 2 — Eigendomsverdeling</SectionH>

        <Field label={`Aandeel ${form.naam2 || "Partner"} (%)`} required>
          <input style={inp} type="number" min="0" max="100" value={form.eigendom2}

      <div style={{ background: C.grayLight, borderRadius: 10, padding: 16 }}>
        <div style={{ fontSize: 12, color: C.gray, fontFamily: fam.sans, marginBottom: 6 }}>Eigendomsverdeling visueel</div>
        <VerdelingBar p1={e1} p2={e2} n1={form.naam1 || "Aanvrager"} n2={form.naam2 || "Partner"} />
      </div>
      {Math.abs(e1 - 50) > 2 && (
        <InfoBox type="warn" style={{ marginTop: 14 }}>Ongelijke eigendomsverdeling ({e1}/{e2}) — de draagplicht op de hypotheek dient hier in beginsel op aan te sluiten, tenzij inbreng van eigen vermogen of eigenwoningverleden aanleiding geeft tot afwijking.</InfoBox>
      )}

function EwvPersoon({ naam, prefix, form, up }) {
  const heeftEwv = form[`ewv${prefix}`];
  const heeftBews = heeftEwv && parseFloat(form[`bews${prefix}`] || 0) > 0;
  return (
    <div style={{ background: C.grayLight, borderRadius: 12, padding: 18, marginBottom: 16 }}>
      <div style={{ fontSize: 14, fontWeight: 700, color: C.navy, marginBottom: 12, fontFamily: fam.sans }}>
        {naam || (prefix === "1" ? "Aanvrager" : "Partner")}
      </div>
      <CheckCard label={`${naam || (prefix === "1" ? "Aanvrager" : "Partner")} heeft eerder een eigen woning gehad`} sub="Selecteer dit als er sprake is van een eigenwoningverleden" checked={heeftEwv} onChange={v => up(`ewv${prefix}`, v)} />
      {heeftEwv && (
        <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}` }}>
          <div className="rg2">
            <Field label="EWR — eigenwoningreserve (€)" half hint="EWR = verkoopprijs vorige woning − resterende EWS − verkoopkosten. Dit bedrag moet bij aankoop nieuwe woning worden 'ingebracht' (bijleenregeling, art. 3.119aa Wet IB 2001).">
              <input style={inp} type="number" value={form[`ewr${prefix}`] || ""} onChange={e => up(`ewr${prefix}`, e.target.value)} placeholder="0" />
            </Field>
            <Field label="BEWS — bestaande eigenwoningschuld per 31-12-2012 (€)" half hint="BEWS = de TOTALE resterende eigenwoningschuld per 31-12-2012 (art. 10bis.1 Wet IB 2001). Niet alleen het aflossingsvrije deel — ook annuïtaire, lineaire of spaarhypotheken die vóór 1-1-2013 liepen tellen mee.">
              <input style={inp} type="number" value={form[`bews${prefix}`] || ""} onChange={e => up(`bews${prefix}`, e.target.value)} placeholder="0" />
            </Field>
            <Field label="Resterende renteaftrekjaren" half hint="Voer het RESTERENDE aantal jaren in (= 30 − reeds benutte jaren). Voorbeeld: 8 jaar aftrek genoten → voer 22 in. Bij overgangsrecht (BEWS): resterende jaren uit de vorige looptijd.">
              <input style={inp} type="number" min="0" max="30" value={form[`jaren${prefix}`] || ""} onChange={e => up(`jaren${prefix}`, e.target.value)} placeholder="bijv. 22" />
            </Field>
            <Field label="Bijleenstand (resterende EWS bij verkoop) (€)" half hint="De resterende eigenwoningschuld op het moment van verkoop van de vorige woning. Vermindert — samen met de EWR — de maximale aftrekbare EWS voor de nieuwe woning (bijleenstand-check).">
              <input style={inp} type="number" value={form[`afsstand${prefix}`] || ""} onChange={e => up(`afsstand${prefix}`, e.target.value)} placeholder="0" />
            </Field>
          </div>
          {heeftBews && (
            <InfoBox type="warn">⚠️ Overgangsrecht aanwezig. Controleer of het BEWS-bedrag past bij het eigendomsaandeel. Vraag ook of de kan-bepaling van toepassing is (zie stap 4).</InfoBox>
          )}
        </div>
      )}
    </div>
  );
}

function Stap3({ form, up }) {
  return (
    <div>
      <SectionH sub="EWR, BEWS, renteaftrekjaren en aflossingsstanden per partner">Stap 3 — Eigenwoningverleden</SectionH>
      <InfoBox type="info">Vier zaken kunnen in het eigenwoningverleden aanwezig zijn: (1) eigenwoningreserve (EWR), (2) 30-jaarsperiode resterende renteaftrek, (3) overgangsrecht/BEWS, (4) aflossingsstanden. Leg ze per persoon zorgvuldig vast.</InfoBox>

      <EwvPersoon naam={form.naam2} prefix="2" form={form} up={up} />

  );
}

function Stap4({ form, up }) {

    <div>
      <SectionH sub="Kan-bepaling overgangsrecht (art. 10bis.1 lid 3 Wet IB 2001)">Stap 4 — Kan-bepaling overgangsrecht</SectionH>
      <InfoBox type="ok">Geen overgangsrecht (BEWS) vastgesteld bij beide partners. Deze stap is niet van toepassing. Klik op 'Volgende' om door te gaan.</InfoBox>
    </div>

  return (
    <div>
      <SectionH sub="Kan-bepaling overgangsrecht (art. 10bis.1 lid 3 Wet IB 2001)">Stap 4 — Kan-bepaling overgangsrecht</SectionH>
      <InfoBox type="danger">⚠️ <strong>Let op: dit is een onomkeerbare, definitieve keuze.</strong> Als het overgangsrecht gezamenlijk wordt toegepast, is het definitief verdeeld. De renteaftrekjaren gaan mee over. Dit kan niet worden teruggedraaid.</InfoBox>
      <div style={{ background: "#FFFBEB", border: `2px solid ${C.gold}`, borderRadius: 12, padding: 20, marginBottom: 16 }}>
        <div style={{ fontWeight: 700, color: C.navy, fontSize: 14, marginBottom: 8, fontFamily: fam.sans }}>Wat is de kan-bepaling?</div>
        <p style={{ margin: 0, fontSize: 13, color: C.textMid, lineHeight: 1.7, fontFamily: fam.sans }}>

        </p>
      </div>
      <div style={{ background: C.grayLight, borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <div className="rg2" style={{ marginBottom: 12 }}>
          {[["1", form.naam1 || "Aanvrager"], ["2", form.naam2 || "Partner"]].map(([p, naam]) => (
            parseFloat(form[`bews${p}`] || 0) > 0 && (

                <div style={{ fontSize: 12, fontWeight: 700, color: C.navy, fontFamily: fam.sans, marginBottom: 6 }}>{naam}</div>
                <div style={{ fontSize: 12, color: C.textMid, fontFamily: fam.sans }}>BEWS: <strong>€ {parseFloat(form[`bews${p}`]).toLocaleString("nl-NL")}</strong></div>
                <div style={{ fontSize: 12, color: C.textMid, fontFamily: fam.sans }}>Resterende jaren: <strong>{form[`jaren${p}`] || "?"}</strong></div>
              </div>
            )
          ))}
        </div>
      </div>
      <Field label="Willen partners het overgangsrecht gezamenlijk toepassen? (kan-bepaling)">
        <select style={sel} value={form.kanBepaling ? "ja" : "nee"} onChange={e => up("kanBepaling", e.target.value === "ja")}>
          <option value="nee">Nee — overgangsrecht individueel per persoon toepassen</option>
          <option value="ja">Ja — gezamenlijk toepassen naar rato schuldaandeel (art. 10bis.1 lid 3)</option>
        </select>
      </Field>
      {form.kanBepaling && (
        <InfoBox type="danger">⚠️ Kan-bepaling gekozen. Leg deze keuze expliciet vast in de draagplichtovereenkomst én in het dossier. Dit is definitief en onherroepelijk.</InfoBox>
      )}
      {!form.kanBepaling && (
        <InfoBox type="info">Individuele toepassing — overgangsrecht wordt per persoon toegewezen aan de desbetreffende leningdelen. De draagplicht voor overgangsrecht-leningdelen wordt uitsluitend aan de rechthebbende partner toegewezen.</InfoBox>
      )}
    </div>
  );
}

function Stap5({ form, up }) {
  const ev1 = parseFloat(form.eigenVermogen1) || 0;
  const ev2 = parseFloat(form.eigenVermogen2) || 0;
  const totaal = ev1 + ev2;
  return (
    <div>
      <SectionH sub="Inbreng eigen middelen en vergoedingsrechten">Stap 5 — Eigen vermogen inbreng</SectionH>
      <InfoBox type="info">Ongelijke inbreng van eigen vermogen creëert vergoedingsrechten. Leg vast wie wat inbrengt en op welke basis de vergoeding later plaatsvindt (nominaal of naar rato waardestijging).</InfoBox>
      <div className="rg2">
        <Field label={`Inbreng ${form.naam1 || "Aanvrager"} (€)`} required hint="Eigen geld, erfenis, schenking, opbrengst vorige woning">
          <input style={inp} type="number" value={form.eigenVermogen1} onChange={e => up("eigenVermogen1", e.target.value)} placeholder="0" />
        </Field>
        <Field label={`Inbreng ${form.naam2 || "Partner"} (€)`} required hint="Eigen geld, erfenis, schenking, opbrengst vorige woning">
          <input style={inp} type="number" value={form.eigenVermogen2} onChange={e => up("eigenVermogen2", e.target.value)} placeholder="0" />

      </div>

        <div style={{ background: C.grayLight, borderRadius: 10, padding: 16, marginBottom: 14 }}>
          <div style={{ fontSize: 12, color: C.gray, marginBottom: 6, fontFamily: fam.sans }}>Verdeling eigen vermogen</div>
          <VerdelingBar p1={totaal > 0 ? Math.round(ev1 / totaal * 100) : 50} p2={totaal > 0 ? Math.round(ev2 / totaal * 100) : 50} n1={form.naam1 || "Aanvrager"} n2={form.naam2 || "Partner"} kleur1={C.navy} kleur2={C.gold} />
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: 12, fontFamily: fam.sans }}>
            <span style={{ color: C.navy }}>€ {ev1.toLocaleString("nl-NL")}</span>
            <span style={{ color: C.textMid }}>Totaal: € {totaal.toLocaleString("nl-NL")}</span>
            <span style={{ color: C.gold }}>€ {ev2.toLocaleString("nl-NL")}</span>
          </div>
        </div>
      )}
      {Math.abs(ev1 - ev2) > 500 && totaal > 0 && (
        <InfoBox type="warn">Ongelijke inbreng. Overweeg een overeenkomst vergoedingsrechten naast de draagplichtovereenkomst.</InfoBox>
      )}

      {/* Verjaringsrisico voor samenwoners */}
      {(form.relatievorm === "ongehuwd" || form.relatievorm === "samenwoners_contract") && totaal > 500 && (
        <div style={{ background: C.redLight, border: `1.5px solid ${C.red}`, borderRadius: 12, padding: 16, marginBottom: 14 }}>
          <div style={{ fontWeight: 700, color: C.red, fontSize: 13.5, marginBottom: 10, fontFamily: fam.sans }}>⏱️ Verjaringsrisico — actie vereist (art. 3:306 BW)</div>
          <p style={{ margin: "0 0 10px", fontSize: 12.5, color: "#7f1d1d", lineHeight: 1.65, fontFamily: fam.sans }}>
            Bij ongehuwde samenwoners verjaart een vergoedingsrecht na <strong>5 jaar</strong> (art. 3:306 BW), tenzij tijdig gestuit of een anti-verjaringsbeding is opgenomen. Bij gehuwden loopt de verjaring <em>niet</em> tijdens het huwelijk. Zonder actie verliest de inbrengende partner zijn/haar recht op terugbetaling.
          </p>
          <div style={{ fontWeight: 700, color: C.red, fontSize: 12, marginBottom: 8, fontFamily: fam.sans }}>Drie opties om verjaring te voorkomen:</div>
          {[
            ["Draagplichtovereenkomst", "Legt de schuldverhouding civiel vast — maar stuit de verjaring niet automatisch."],
            ["Anti-verjaringsbeding via notaris (aanbevolen)", "Notariële akte met anti-verjaringsbeding voorkomt verjaring permanent. Verplicht via notaris."],
            ["Periodieke stuiting (art. 3:317 BW)", "Schriftelijke aanmaning of erkenning stuit de verjaring. Herhaal vóór het verstrijken van 5 jaar."],
          ].map(([t, s], i) => (
            <div key={i} style={{ display: "flex", gap: 10, marginBottom: 8, padding: "8px 10px", background: C.white, borderRadius: 7 }}>
              <span style={{ color: C.red, fontWeight: 700 }}>{i + 1}.</span>
              <div>
                <div style={{ fontWeight: 700, fontSize: 12.5, color: C.navy, fontFamily: fam.sans }}>{t}</div>
                <div style={{ fontSize: 11.5, color: C.textMid, fontFamily: fam.sans, marginTop: 2 }}>{s}</div>
              </div>
            </div>
          ))}
        </div>
      )}
      <Field label="Waarderingsbasis vergoedingsrecht" hint="Hoe wordt de vergoeding bij verkoop bepaald?">
        <select style={sel} value={form.waarderingsBasis || "nominaal"} onChange={e => up("waarderingsBasis", e.target.value)}>
          <option value="nominaal">Nominaal — terugbetaling van het ingebrachte bedrag</option>
          <option value="proportioneel">Proportioneel — naar rato van waardestijging woning</option>
          <option value="overleg">Nader te bepalen in overleg / via notaris</option>
        </select>
      </Field>
      <Field label="Welke documenten zijn gewenst?">
        <select style={sel} value={form.gewensteDocs || "draagplicht"} onChange={e => up("gewensteDocs", e.target.value)}>
          <option value="draagplicht">Alleen draagplichtovereenkomst</option>
          <option value="vergoedingsrechten">Alleen overeenkomst vergoedingsrechten</option>
          <option value="beide">Beide documenten</option>
          <option value="scheiding">Draagplichtovereenkomst scheidingscontext</option>
        </select>
      </Field>
    </div>
  );
}

function Stap6({ form, up }) {
  const upLD = (i, k, v) => {
    const ld = [...form.leningdelen];
    ld[i] = { ...ld[i], [k]: v };
    if (k === "draag1") ld[i].draag2 = String(Math.max(0, 100 - (parseFloat(v) || 0)));
    if (k === "draag2") ld[i].draag1 = String(Math.max(0, 100 - (parseFloat(v) || 0)));
    up("leningdelen", ld);
  };
  const addLD = () => up("leningdelen", [...form.leningdelen, { bedrag: "", soort: "annuïtair", recht: "nieuw", draag1: "50", draag2: "50" }]);
  const delLD = i => up("leningdelen", form.leningdelen.filter((_, j) => j !== i));

  return (
    <div>
      <SectionH sub="Bedrag, soort, recht en draagplicht per leningdeel">Stap 6 — Leningdelen & Draagplicht</SectionH>
      <InfoBox type="info">Splits leningdelen zodanig dat de draagplicht per persoon overeenkomt met de gewenste fiscale en civiele situatie. Leningdelen met overgangsrecht worden uitsluitend toegewezen aan de rechthebbende partner (tenzij kan-bepaling van toepassing).</InfoBox>
      {form.leningdelen.map((ld, i) => (
        <div key={i} style={{ background: i % 2 === 0 ? C.grayLight : "#FAFAF8", borderRadius: 12, padding: 16, marginBottom: 12, border: `1px solid ${C.border}` }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <span style={{ fontWeight: 700, color: C.navy, fontSize: 13.5, fontFamily: fam.sans }}>Leningdeel {i + 1}</span>
            {form.leningdelen.length > 1 && <button onClick={() => delLD(i)} style={{ ...btnSm, color: C.red, border: `1px solid ${C.red}` }}>✕ Verwijder</button>}
          </div>
          <div className="rg3ld">
            <Field label="Bedrag (€)"><input style={inp} type="number" value={ld.bedrag} onChange={e => upLD(i, "bedrag", e.target.value)} placeholder="200000" /></Field>
            <Field label="Soort">
              <select style={sel} value={ld.soort} onChange={e => upLD(i, "soort", e.target.value)}>
                <option value="annuïtair">Annuïtair</option>
                <option value="lineair">Lineair</option>
                <option value="aflossingsvrij">Aflossingsvrij</option>
              </select>
            </Field>
            <Field label="Recht / regime">
              <select style={sel} value={ld.recht} onChange={e => upLD(i, "recht", e.target.value)}>
                <option value="nieuw">Nieuw recht (na 1-1-2013)</option>
                <option value="oud">Overgangsrecht (art. 10bis.1)</option>
              </select>
            </Field>
          </div>
          <div style={{ background: C.white, borderRadius: 8, padding: 12, border: `1px solid ${C.border}` }}>
            <div style={{ fontSize: 11.5, fontWeight: 700, color: C.navy, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.06em", fontFamily: fam.sans }}>Interne draagplicht</div>
            <div className="rg2">
              <Field label={`${form.naam1 || "Aanvrager"} (%)`}><input style={inp} type="number" min="0" max="100" value={ld.draag1} onChange={e => upLD(i, "draag1", e.target.value)} /></Field>
              <Field label={`${form.naam2 || "Partner"} (%)`}><input style={inp} type="number" min="0" max="100" value={ld.draag2} onChange={e => upLD(i, "draag2", e.target.value)} /></Field>
            </div>
            <VerdelingBar p1={parseFloat(ld.draag1) || 0} p2={parseFloat(ld.draag2) || 0} n1={form.naam1 || "Aanvrager"} n2={form.naam2 || "Partner"} />
          </div>
          {ld.recht === "oud" && (
            <div style={{ marginTop: 10 }}>
              <InfoBox type="warn">Overgangsrecht (BEWS) — wijs dit leningdeel toe aan de partner met het BEWS-recht. Controleer of het bedrag past binnen het BEWS-saldo van die partner. Gebruik de kan-bepaling (stap 4) als het BEWS-saldo onvoldoende is.</InfoBox>
            </div>
          )}
          {ld.soort === "aflossingsvrij" && ld.recht === "nieuw" && (
            <div style={{ marginTop: 10 }}>
              <InfoBox type="danger">🚫 <strong>Geen renteaftrek mogelijk!</strong> Aflossingsvrije leningen afgesloten ná 1 januari 2013 komen NIET in aanmerking voor hypotheekrenteaftrek (art. 3.119a Wet IB 2001 — aflossingsverplichting). Wijzig naar annuïtair of lineair voor renteaftrek, of gebruik overgangsrecht (BEWS) indien aanwezig.</InfoBox>
            </div>
          )}
        </div>
      ))}
      <button onClick={addLD} style={{ ...btnSecondary, marginBottom: 16 }}>+ Leningdeel toevoegen</button>

      {/* Bijleenregeling max EWS check */}
      {(() => {
        const K = (parseFloat(form.aankoopprijs)||0) + (parseFloat(form.verwervingskosten)||0);
        const checks = [["1", form.naam1||"Aanvrager"], ["2", form.naam2||"Partner"]].map(([p, naam]) => {
          const eigendomPct = (parseFloat(p==="1" ? form.eigendom1 : form.eigendom2)||50)/100;
          const ewr = parseFloat(form[`ewr${p}`]||0);
          const bijleenstand = parseFloat(form[`afsstand${p}`]||0);
          const maxEWS = Math.max(0, K * eigendomPct - ewr + bijleenstand);
          const draagplicht = form.leningdelen.reduce((s,l) => s + (parseFloat(l.bedrag)||0)*(parseFloat(p==="1"?l.draag1:l.draag2)||50)/100, 0);
          const overschrijding = draagplicht - maxEWS;
          const box3Deel = Math.max(0, overschrijding);
          const box3Rente = box3Deel * 0.04; // indicatief 4% rente
          return { naam, maxEWS, draagplicht, overschrijding, ewr, bijleenstand, box3Deel, box3Rente };
        });
        const heeftEWR = checks.some(c => c.ewr > 0);
        if (!heeftEWR || K === 0) return null;
        return (
          <div style={{ background: C.white, borderRadius: 12, border: `1.5px solid ${C.border}`, padding: 18, marginBottom: 14 }}>
            <div style={{ fontWeight: 700, color: C.navy, fontSize: 13.5, marginBottom: 6, fontFamily: fam.sans }}>
              Bijleenregeling check (art. 3.119aa Wet IB 2001)
            </div>
            <div style={{ fontSize: 12, color: C.textMid, fontFamily: fam.sans, marginBottom: 12 }}>
              Max. aftrekbare EWS per partner = verwervingskosten × eigendomsaandeel − EWR + bijleenstand. Draagplicht boven dit maximum is <strong>box 3 — géén renteaftrek</strong>.
            </div>
            {checks.map((c, i) => (
              <div key={i} style={{ padding: "12px 14px", marginBottom: 8, borderRadius: 8, background: c.box3Deel > 500 ? C.redLight : C.greenLight, borderLeft: `3px solid ${c.box3Deel > 500 ? C.red : C.green}` }}>
                <div style={{ fontWeight: 700, fontSize: 12.5, color: c.box3Deel > 500 ? C.red : C.green, fontFamily: fam.sans, marginBottom: c.box3Deel > 500 ? 8 : 0 }}>
                  {c.naam} — Max. EWS: € {Math.round(c.maxEWS).toLocaleString("nl-NL")} | Draagplicht: € {Math.round(c.draagplicht).toLocaleString("nl-NL")}
                  {c.box3Deel > 500 ? ` | 🚫 Box 3: € ${Math.round(c.box3Deel).toLocaleString("nl-NL")}` : " ✓ Binnen max. EWS (box 1)"}
                </div>
                {c.box3Deel > 500 && (
                  <div style={{ fontSize: 11.5, color: "#7f1d1d", fontFamily: fam.sans, lineHeight: 1.6 }}>
                    <strong>€ {Math.round(c.box3Deel).toLocaleString("nl-NL")} valt in box 3</strong> — over dit deel is de rente niet aftrekbaar.
                    Indicatief verlies renteaftrek (4% rente, 37,56% maximaal aftrektarief 2026): <strong>€ {Math.round(c.box3Rente * 0.3756).toLocaleString("nl-NL")} per jaar</strong> minder aftrek.
                    Oorzaak: EWR van € {Math.round(c.ewr).toLocaleString("nl-NL")} is niet volledig ingebracht.
                    Oplossing: inbreng verhogen met € {Math.round(c.box3Deel).toLocaleString("nl-NL")} om box 3-deel te elimineren.
                  </div>
                )}
              </div>
            ))}
          </div>
        );
      })()}
      <Field label="Bijzonderheden / toelichting" hint="Bijv. erfenis, schenking, verbouwing, overbrugging, bestaand samenlevingscontract">
        <textarea style={{ ...inp, minHeight: 72, resize: "vertical" }} value={form.bijzonderheden} onChange={e => up("bijzonderheden", e.target.value)} placeholder="Optioneel..." />
      </Field>

      {/* Onderscheid verplichte vs. extra aflossingen */}
      <div style={{ background: "#FFFBEB", border: `1.5px solid ${C.gold}`, borderRadius: 12, padding: 16, marginTop: 4 }}>
        <div style={{ fontWeight: 700, color: C.navy, fontSize: 13, marginBottom: 10, fontFamily: fam.sans }}>

        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {[

            { titel: "Extra (niet-verplichte) aflossing op gezamenlijk leningdeel", kleur: C.orange, bg: C.orangeLight, tekst: "Wél vergoedingsrecht — de aflossende partner heeft een vordering op de ander ter grootte van diens aandeel in de extra aflossing. Leg dit vast in de overeenkomst vergoedingsrechten, inclusief de waarderingsbasis (nominaal of proportioneel)." },

}

// TAB 2: ADVIESRAPPORT TEKSTEN
// ═══════════════════════════════════════════════════════════════════
function AdviesrapportTab({ form }) {
  const [filter, setFilter] = useState("alle");
  const [expanded, setExpanded] = useState(null);

  const n1 = form?.naam1 || "[AANVRAGER]";
  const n2 = form?.naam2 || "[PARTNER]";

  const gevuld = (tekst) => tekst.replace("[AANVRAGER]", n1).replace("[PARTNER]", n2);

  const tags = ["alle", "draagplicht", "vergoedingsrechten", "draagplicht+vergoedingsrechten", "scheiding"];
  const gefilterd = ADVIES_TEKSTEN.filter(t => filter === "alle" || t.tag === filter);

  const ev1 = parseFloat(form?.eigenVermogen1 || 0);
  const ev2 = parseFloat(form?.eigenVermogen2 || 0);
  const hasVergoeding = Math.abs(ev1 - ev2) > 500;
  const isScheiding = form?.context === "scheiding";

  const aanbevolen = (t) => {
    if (isScheiding && t.tag === "scheiding") return true;
    if (!isScheiding && hasVergoeding && t.id === "9") return true;
    if (!isScheiding && !hasVergoeding && t.id === "5") return true;
    return false;
  };

  return (
    <div>
      <div style={{ background: C.navy, borderRadius: 16, padding: 24, marginBottom: 24, display: "flex", alignItems: "center", gap: 18 }}>
        <div style={{ fontSize: 32 }}>📝</div>
        <div>
          <div style={{ color: C.goldLight, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.12em", fontFamily: fam.sans }}>Adviesrapport</div>
          <div style={{ color: C.white, fontSize: 19, fontWeight: 700, fontFamily: fam.serif }}>Adviesrapport Tekstbibliotheek</div>
          <div style={{ color: C.textLight, fontSize: 12.5, marginTop: 2, fontFamily: fam.sans }}>13 kant-en-klare varianten — kopieer de passende tekst direct naar uw adviesrapport</div>
        </div>
      </div>

      {/* Filter */}
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 20 }}>
        {tags.map(t => (
          <button key={t} onClick={() => setFilter(t)} style={{ padding: "6px 14px", borderRadius: 20, border: `1.5px solid ${filter === t ? C.navy : C.border}`, background: filter === t ? C.navy : C.white, color: filter === t ? C.white : C.navy, fontWeight: filter === t ? 700 : 400, cursor: "pointer", fontSize: 12.5, fontFamily: fam.sans }}>
            {t === "alle" ? "Alle" : t === "draagplicht" ? "Draagplicht" : t === "vergoedingsrechten" ? "Vergoedingsrechten" : t === "draagplicht+vergoedingsrechten" ? "Beide" : "Scheiding"}
          </button>
        ))}
      </div>

      {form?.naam1 && (
        <InfoBox type="info">Varianten worden automatisch ingevuld met: <strong>{n1}</strong> en <strong>{n2}</strong></InfoBox>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {gefilterd.map((t) => {
          const isOpen = expanded === t.id;
          const isAanbevolen = aanbevolen(t);
          const tekst = gevuld(t.tekst);
          return (
            <div key={t.id} style={{ background: C.white, borderRadius: 12, boxShadow: "0 2px 12px rgba(11,31,58,.06)", border: `1.5px solid ${isAanbevolen ? C.gold : C.border}`, overflow: "hidden" }}>
              <div onClick={() => setExpanded(isOpen ? null : t.id)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 18px", cursor: "pointer", userSelect: "none" }}>
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                    <span style={{ fontWeight: 700, color: C.navy, fontSize: 13.5, fontFamily: fam.sans }}>{t.id} — {t.label}</span>
                    {isAanbevolen && <span style={{ background: C.goldPale, color: C.gold, border: `1px solid ${C.gold}`, borderRadius: 20, padding: "2px 10px", fontSize: 11, fontWeight: 700, fontFamily: fam.sans }}>★ Aanbevolen</span>}
                  </div>
                  <div style={{ fontSize: 12, color: C.gray, marginTop: 3, fontFamily: fam.sans }}>{t.situatie}</div>
                </div>
                <span style={{ color: C.gray, fontSize: 16, marginLeft: 12 }}>{isOpen ? "▲" : "▼"}</span>
              </div>
              {isOpen && (
                <div style={{ borderTop: `1px solid ${C.border}`, padding: "16px 18px" }}>
                  <div style={{ background: C.cream, borderRadius: 8, padding: "16px 18px", fontSize: 13, lineHeight: 1.8, color: C.text, whiteSpace: "pre-wrap", fontFamily: fam.serif, marginBottom: 12 }}>
                    {tekst}
                  </div>
                  <CopyBtn text={tekst} />
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// TAB 3: DOCUMENTEN GENERATOR
// ═══════════════════════════════════════════════════════════════════
function DocumentenTab({ form }) {
  const [docType, setDocType] = useState(form?.gewensteDocs || "draagplicht");
  const [result, setResult] = useState("");
  const [loading, setLoading] = useState(false);

  const generate = () => {
    setLoading(true);
    setResult("");
    try {
      setResult(genereerDocument(docType, form || {}));
    } catch (e) { setResult("Fout bij opstellen van het document: " + e.message); }
    setLoading(false);
  };

  const docTitel = () => (types.find(t => t.value === docType)?.label || "document");

  const printDoc = () => {
    const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const w = window.open("", "_blank");
    if (!w) { alert("Het printvenster is geblokkeerd. Sta pop-ups toe of gebruik 'Kopieer'."); return; }
    w.document.write(`<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><title>${esc(docTitel())} — concept</title><style>body{font-family:Georgia,"Times New Roman",serif;margin:2cm;color:#111}pre{white-space:pre-wrap;font-family:inherit;font-size:11pt;line-height:1.6}</style></head><body><pre>${esc(result)}</pre></body></html>`);
    w.document.close();
    w.focus();
    setTimeout(() => w.print(), 250);
  };

  const downloadDoc = () => {
    const blob = new Blob([result], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${docTitel().toLowerCase().replace(/[^a-z0-9]+/g, "-")}-concept.txt`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const types = [
    { value: "draagplicht", label: "Draagplichtovereenkomst", icon: "📋", sub: "Interne draagplicht per leningdeel" },
    { value: "vergoedingsrechten", label: "Overeenkomst vergoedingsrechten", icon: "💰", sub: "Inbreng eigen vermogen, aflossingen, verbouwingen" },
    { value: "beide", label: "Beide documenten", icon: "📑", sub: "Draagplicht én vergoedingsrechten" },
    { value: "scheiding", label: "Scheidingscontext", icon: "⚖️", sub: "Tijdelijke afspraken tot verkoop/overname" },
  ];

  return (
    <div>
      <div style={{ background: C.navy, borderRadius: 16, padding: 24, marginBottom: 24, display: "flex", alignItems: "center", gap: 18 }}>
        <div style={{ fontSize: 32 }}>📄</div>
        <div>
          <div style={{ color: C.goldLight, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.12em", fontFamily: fam.sans }}>Modeldocumenten</div>
          <div style={{ color: C.white, fontSize: 19, fontWeight: 700, fontFamily: fam.serif }}>Documenten opstellen</div>
          <div style={{ color: C.textLight, fontSize: 12.5, marginTop: 2, fontFamily: fam.sans }}>Vaste modelteksten aangevuld met de ingevulde gegevens — altijd ter beoordeling door notaris/jurist</div>
        </div>
      </div>

      {!form?.naam1 && (
        <InfoBox type="warn">Vul eerst de wizard in (tabblad Analyse) om de gegevens in het document te verwerken. U kunt ook direct een document opstellen met de standaardgegevens.</InfoBox>
      )}

      <div style={{ background: C.white, borderRadius: 16, boxShadow: "0 4px 20px rgba(11,31,58,.07)", padding: 24, marginBottom: 18 }}>
        <SectionH>Kies het op te stellen document</SectionH>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 10, marginBottom: 20 }}>
          {types.map(t => (
            <div key={t.value} onClick={() => setDocType(t.value)} style={{ border: `2px solid ${docType === t.value ? C.navy : C.border}`, borderRadius: 10, padding: 14, cursor: "pointer", background: docType === t.value ? C.navyGlass : C.white, transition: "all 0.15s" }}>
              <div style={{ fontSize: 22, marginBottom: 6 }}>{t.icon}</div>
              <div style={{ fontWeight: 700, fontSize: 13, color: C.navy, fontFamily: fam.sans }}>{t.label}</div>
              <div style={{ fontSize: 11.5, color: C.gray, marginTop: 3, fontFamily: fam.sans }}>{t.sub}</div>
            </div>
          ))}
        </div>
        <button onClick={generate} disabled={loading} style={{ ...btnGold, opacity: loading ? 0.7 : 1, display: "flex", alignItems: "center", gap: 8 }}>
          {loading ? "⏳ Bezig..." : "📄 Stel modeldocument op"}
        </button>
      </div>

      {result && (
        <div style={{ background: C.white, borderRadius: 16, boxShadow: "0 4px 20px rgba(11,31,58,.07)", padding: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
            <SectionH>{types.find(t => t.value === docType)?.label} — Concept</SectionH>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <span style={{ background: C.orangeLight, color: C.orange, padding: "4px 12px", borderRadius: 20, fontSize: 11, fontWeight: 700, fontFamily: fam.sans }}>CONCEPT</span>
              <CopyBtn text={result} />
              <button onClick={printDoc} style={{ ...btnSm, background: C.grayLight, border: `1px solid ${C.border}` }} title="Afdrukken in nieuw venster">🖨️ Afdrukken</button>
              <button onClick={downloadDoc} style={{ ...btnSm, background: C.grayLight, border: `1px solid ${C.border}` }} title="Download als tekstbestand">⬇️ Download</button>
            </div>

// TAB 4: DOSSIER CHECKLIST
// ═══════════════════════════════════════════════════════════════════
function DossierTab() {
  const init = {};
  CHECKLIST.forEach(s => s.items.forEach((item, i) => { init[`${s.sectie}-${i}`] = false; }));
  const [checked, setChecked] = useState(init);

  const toggle = (k) => setChecked(c => ({ ...c, [k]: !c[k] }));
  const totaalItems = Object.keys(checked).length;
  const afgerond = Object.values(checked).filter(Boolean).length;
  const pct = Math.round((afgerond / totaalItems) * 100);

  return (
    <div>
      <div style={{ background: C.navy, borderRadius: 16, padding: 24, marginBottom: 24 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 18 }}>
            <div style={{ fontSize: 32 }}>✅</div>
            <div>
              <div style={{ color: C.goldLight, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.12em", fontFamily: fam.sans }}>AFM Dossier</div>
              <div style={{ color: C.white, fontSize: 19, fontWeight: 700, fontFamily: fam.serif }}>Dossier Checklist</div>
              <div style={{ color: C.textLight, fontSize: 12.5, marginTop: 2, fontFamily: fam.sans }}>Draagplichtovereenkomst — volledigheidscontrole</div>
            </div>
          </div>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 32, fontWeight: 800, color: pct === 100 ? "#4ADE80" : C.goldLight, fontFamily: fam.sans }}>{pct}%</div>
            <div style={{ color: C.textLight, fontSize: 12, fontFamily: fam.sans }}>{afgerond}/{totaalItems} voltooid</div>
          </div>
        </div>
        <div style={{ marginTop: 16, height: 8, background: C.navyLight, borderRadius: 4, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${pct}%`, background: pct === 100 ? "#4ADE80" : C.gold, borderRadius: 4, transition: "width 0.4s" }} />
        </div>
      </div>

      {CHECKLIST.map((sectie, si) => {
        const items = sectie.items;
        const done = items.filter((_, i) => checked[`${sectie.sectie}-${i}`]).length;
        return (
          <div key={si} style={{ background: C.white, borderRadius: 16, boxShadow: "0 4px 20px rgba(11,31,58,.07)", padding: 24, marginBottom: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <h3 style={{ margin: 0, color: sectie.kleur, fontSize: 14, fontWeight: 700, fontFamily: fam.sans }}>{sectie.sectie}</h3>
              <span style={{ fontSize: 12, fontFamily: fam.sans, background: done === items.length ? C.greenLight : C.grayLight, color: done === items.length ? C.green : C.gray, padding: "3px 10px", borderRadius: 20, fontWeight: 600 }}>{done}/{items.length}</span>
            </div>
            {items.map((item, i) => {
              const k = `${sectie.sectie}-${i}`;
              const isChecked = checked[k];
              return (
                <div key={i} onClick={() => toggle(k)} style={{ display: "flex", alignItems: "flex-start", gap: 12, padding: "10px 12px", borderRadius: 8, cursor: "pointer", background: isChecked ? C.greenLight : "transparent", marginBottom: 4, transition: "background 0.15s" }}>
                  <div style={{ width: 18, height: 18, borderRadius: 4, border: `2px solid ${isChecked ? C.green : C.border}`, background: isChecked ? C.green : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 2 }}>
                    {isChecked && <span style={{ color: C.white, fontSize: 11, fontWeight: 900 }}>✓</span>}
                  </div>
                  <span style={{ fontSize: 13, color: isChecked ? C.green : C.text, lineHeight: 1.6, textDecoration: isChecked ? "line-through" : "none", fontFamily: fam.sans, transition: "color 0.15s" }}>{item}</span>
                </div>
              );
            })}
          </div>
        );
      })}

      {pct === 100 && (
        <div style={{ background: C.greenLight, border: `2px solid ${C.green}`, borderRadius: 16, padding: 20, textAlign: "center" }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>🎉</div>
          <div style={{ fontWeight: 700, color: C.green, fontSize: 16, fontFamily: fam.sans }}>Dossier volledig!</div>
          <div style={{ color: C.green, fontSize: 13, marginTop: 4, fontFamily: fam.sans }}>Alle controlepunten zijn afgevinkt. Het dossier is gereed.</div>
        </div>
      )}
    </div>
  );
}
