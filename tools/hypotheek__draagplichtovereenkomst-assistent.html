// TAB 5: KENNISBANK
// ═══════════════════════════════════════════════════════════════════
function KennisbankTab() {
  const [open, setOpen] = useState(0);
  const secties = [
    {
      icon: "⚖️", titel: "Wat is een draagplichtovereenkomst?", kleur: C.navy,
      inhoud: `Als twee partners samen een hypotheek afsluiten, zijn zij jegens de bank allebei volledig aansprakelijk. Wat er intern tussen hen geldt — wie hoeveel draagt, wie recht heeft op de opbrengst bij verkoop — staat daar volledig los van. Zonder schriftelijke afspraken bepaalt de wet dat standaard: 50/50, ongeacht wie wat heeft ingebracht.

Een draagplichtovereenkomst wijkt af van die wettelijke standaard (art. 6:10 BW). In de overeenkomst leggen partners onderling vast wie welk deel van de hypotheekschuld intern draagt. Dat kan afwijken van de eigendomsverdeling in het kadaster, en is met name van belang als er sprake is van ongelijke inbreng van eigen vermogen, een verschillend eigenwoningverleden, een ongelijke eigendomsverdeling of meerdere leningdelen met uiteenlopende fiscale eigenschappen.

Kernpunt: de overeenkomst regelt uitsluitend de interne verhouding. De bank kan beide partners altijd aanspreken voor de volledige hypotheekschuld — dat verandert niet.`
    },
    {
      icon: "🔢", titel: "Het eigenwoningverleden — 4 elementen", kleur: C.navyMid,
      inhoud: `In het eigenwoningverleden kunnen vier zaken aanwezig zijn:

1. Eigenwoningreserve (EWR)
De EWR is de overwaarde die overblijft na verkoop: verkoopprijs minus resterende EWS en verkoopkosten. De EWR moet worden ingebracht bij aankoop van de nieuwe woning (bijleenregeling). Bij ongelijke eigendomsverdeling wordt de EWR naar rato verdeeld.

2. 30-jaarsperiode (reeds genoten renteaftrekjaren)
Hypotheekrente is maximaal 30 jaar aftrekbaar. Wie al eerder renteaftrek heeft gehad, heeft minder jaren over. Dit is persoonsgebonden en mag niet worden uitgewisseld zonder draagplichtovereenkomst.

3. Overgangsrecht / BEWS (Bestaande Eigen Woningschuld)
Hypotheken afgesloten vóór 1 januari 2013 vallen onder het overgangsrecht (art. 10bis.1 Wet IB 2001). Dit geeft recht op renteaftrek voor aflossingsvrije leningen. Het BEWS-bedrag mag maximaal gelijk zijn aan de resterende schuld op 31 december 2012.

4. Aflossingsstanden
De aflossingsstand geeft aan hoeveel er al is afgelost op de vorige lening. Dit bepaalt de maximale annuïtaire of lineaire lening bij de nieuwe woning (bijleenstand).`
    },
    {
      icon: "📌", titel: "De kan-bepaling — overgangsrecht gezamenlijk toepassen", kleur: "#1D4ED8",
      inhoud: `Artikel 10bis.1, derde lid Wet IB 2001 geeft partners de mogelijkheid om het overgangsrecht van één partner gezamenlijk toe te passen, naar rato van ieders aandeel in de schuld.

Dit is een kan-bepaling: het is een keuze, geen verplichting.

Wanneer relevant?
Als één partner meer BEWS heeft dan zijn/haar aandeel in de schuld, of als de partner zonder overgangsrecht ook wil profiteren van de aflossingsvrije constructie.

Gevolgen van de kan-bepaling:
• Het overgangsrecht wordt definitief en onomkeerbaar verdeeld
• De resterende renteaftrekjaren van de partner met overgangsrecht gaan deels mee over naar de andere partner
• Leg de keuze altijd expliciet vast in de draagplichtovereenkomst en het dossier

Advies: bespreek de kan-bepaling altijd expliciet met beide partners. Als het overgangsrecht gezamenlijk wordt toegepast, is het definitief verdeeld en kan dit niet worden teruggedraaid.`
    },
    {
      icon: "✅", titel: "Wanneer is een draagplichtovereenkomst noodzakelijk?", kleur: C.green,
      inhoud: `Een draagplichtovereenkomst is (sterk) aanbevolen of noodzakelijk bij:

Ongehuwd samenwonenden
Zonder overeenkomst geldt wettelijk 50/50 (art. 6:10 BW), ongeacht wie meer betaalt of inbrengt. Dit is de meest voorkomende situatie.

Ongelijke inbreng eigen vermogen
Als één partner meer eigen geld inbrengt, ontstaan vergoedingsrechten. De overeenkomst legt dit bewijsbaar vast — inclusief de waarderingsbasis (nominaal of proportioneel).

Eigenwoningverleden bij één of beide partners
Verschillende renteaftrekperioden en EWR's dreigen fiscaal te 'mengen'. Een draagplichtovereenkomst sluit dit expliciet uit en beschermt ieders fiscale positie.

Overgangsrecht (BEWS) aanwezig
Aflossingsvrij lenen met renteaftrek is persoonsgebonden. Door correcte toewijzing van leningdelen en draagplicht behoudt de rechthebbende partner zijn overgangsrecht.

Meerdere leningdelen
Expliciete toewijzing per leningdeel is nodig voor fiscale doelmatigheid.`
    },
    {
      icon: "❌", titel: "Wanneer is een draagplichtovereenkomst minder relevant?", kleur: C.orange,
      inhoud: `Gehuwd in algehele gemeenschap van goederen
Bij dit huwelijksgoederenregime vallen woning en hypotheek van rechtswege in de gemeenschap. Alle schulden en bezittingen zijn al 50/50 gedeeld — een draagplichtovereenkomst heeft hier geen juridisch effect.

Volledig gelijke situatie
Als beide partners starter zijn, geen eigenwoningverleden hebben, een gelijk eigen vermogen inbrengen en 50/50 eigenaar worden, is het risico gering. Toch geldt ook hier: bij aankoop van een woning worden verwervingskosten altijd uit eigen middelen voldaan, waardoor er vrijwel altijd sprake is van enige ongelijkheid. Een kort gesprek met de adviseur is altijd zinvol.

Kosten-batenafweging
Notariële vastlegging kost extra geld. Bij een volledig symmetrische situatie kan een adviseur concluderen dat het risico beperkt is. Adviseer echter altijd om de afweging schriftelijk te documenteren — zowel voor de cliënt als ter bescherming van de adviseur.`
    },
    {
      icon: "⚠️", titel: "Vervallen van de overeenkomst — trouwen", kleur: C.red,
      inhoud: `Een draagplichtovereenkomst vervalt bij huwelijk in gemeenschap van goederen.

Het gevolg is dat iedere partner alsnog draagplichtig wordt voor de helft van de schuld, ongeacht wat er in de overeenkomst stond. Vergoedingsrechten die zijn opgebouwd kunnen ook gedeeltelijk verloren gaan (voor de helft die in de gemeenschap valt).

Om dit te voorkomen:
Adviseer cliënten die plannen hebben om te trouwen om huwelijkse voorwaarden te maken. Daarin kan de draagplichtovereenkomst worden opgenomen of doorverwezen.

Hetzelfde geldt voor het aangaan van een geregistreerd partnerschap zonder partnerschapsvoorwaarden.

Adviseer ook: de overeenkomst moet worden herzien bij:
• Verkoop van de woning
• Aankoop van een nieuwe woning
• Extra aflossing (niet periodiek)
• Verbouwing met ongelijke inbreng
• Huwelijk of geregistreerd partnerschap`
    },
    {
      icon: "🏗️", titel: "Individuele benadering — wanneer mogelijk en wanneer niet?", kleur: C.navy,
      inhoud: `De individuele benadering (draagplichtovereenkomst) is ALLEEN mogelijk als de woning NIET in een wettelijke gemeenschap van goederen valt (art. 1:94 BW).

Wanneer WEL individueel benaderen:
• Ongehuwde samenwoners (geen of met samenlevingscontract)
• Gehuwd op huwelijkse voorwaarden (koude uitsluiting of beperkte gemeenschap)
• Geregistreerd partnerschap met voorwaarden

Wanneer NIET individueel benaderen:
• Gehuwd in algehele gemeenschap van goederen — de woning en hypotheek vallen in de gemeenschap en zijn al van rechtswege 50/50 verdeeld. Een draagplichtovereenkomst heeft hier geen juridisch effect.

Wil een koppel in gemeenschap tóch individueel regelen? Dan zijn huwelijkse voorwaarden nodig via een notariële akte. Hierin kan de draagplichtovereenkomst worden opgenomen of doorverwezen. Let op: huwelijkse voorwaarden vereisen een notarieel verleden akte en zijn niet via een onderhandse overeenkomst te regelen.`
    },
    {
      icon: "📦", titel: "Box 3-deel in de hypotheek — bijleenregeling", kleur: "#DC2626",
      inhoud: `Als een partner de eigenwoningreserve (EWR) niet volledig inbrengt bij aankoop van een nieuwe woning, ontstaat een box 3-deel in de hypotheek. Over dat deel is de rente NIET aftrekbaar.

Berekening (bijleenregeling, art. 3.119aa Wet IB 2001):
Maximale aftrekbare EWS = verwervingskosten × eigendomsaandeel − EWR + bijleenstand

Voorbeeld: verwervingskosten €500.000, eigendom 50%, EWR €80.000, bijleenstand €0:
Max EWS = €250.000 − €80.000 = €170.000

Als de draagplicht van deze partner €200.000 is, dan:
Box 3-deel = €200.000 − €170.000 = €30.000 (géén renteaftrek)
Jaarlijks renteaftrekverlies (4% rente, 37,56% maximaal aftrektarief 2026) = €30.000 × 4% × 37,56% ≈ €451

Drie oplossingen:
1. EWR volledig inbrengen als eigen vermogen (elimineert box 3-deel)
2. Draagplicht verlagen tot max. EWS (kleiner leningdeel)
3. Bewust accepteren en documenteren

Let op: ook bij trouwen zonder huwelijkse voorwaarden kan een hertoetsmoment leiden tot box 3-verhuizing van hypotheekdelen.`
    },
    {
      icon: "⏱️", titel: "Verjaring van vergoedingsrechten (art. 3:306 BW)", kleur: "#7C3AED",
      inhoud: `Bij ongehuwde samenwoners geldt de gewone verjaringstermijn van 5 jaar (art. 3:306 BW). Een vordering uit vergoedingsrecht verjaart 5 jaar na opeisbaarheid, tenzij tijdig gestuit.

Bij gehuwden en geregistreerde partners: de verjaring loopt NIET tijdens het huwelijk/partnerschap (art. 3:321 lid 1 sub a BW). Dit is een fundamenteel verschil.

Drie manieren om verjaring te voorkomen bij samenwoners:

1. Anti-verjaringsbeding via notaris (sterkste optie)
Een notariële akte bevat een beding dat verjaring uitsluit of uitstelt. Dit geeft permanente bescherming zolang de overeenkomst geldt. Vereist notariële medewerking.

2. Periodieke stuiting (art. 3:317 BW)
Stuiting door schriftelijke aanmaning of schriftelijke erkenning door de schuldenaar stuit de verjaring. De termijn begint opnieuw te lopen. Herhaal vóór elke 5-jaarstermijn. Leg de stuiting schriftelijk vast met datum.

3. Draagplichtovereenkomst als civiele vastlegging
Stuit de verjaring op zichzelf niet automatisch, maar is een bewijsmiddel. Combineer altijd met een van de bovenstaande opties.

Praktisch advies: voer bij het opmaken van de overeenkomst een vaste stuitingsdatum in het dossier in. Stel een kalenderherinnering in voor 4,5 jaar na inbreng.`
    },
    {
      icon: "🔄", titel: "Gevolgen van trouwen — 4 kritische punten", kleur: C.red,
      inhoud: `Wanneer ongehuwde samenwoners met een draagplichtovereenkomst besluiten te trouwen ZONDER huwelijkse voorwaarden, treden er 4 kritische gevolgen op:

1. Draagplichtovereenkomst vervalt van rechtswege
De overeenkomst heeft geen effect meer. De wettelijke 50/50-verdeling treedt in werking alsof de overeenkomst nooit heeft bestaan.

2. Alle leningdelen mengen naar de eigendomsverhouding
Openstaande leningen worden gemengd conform de bezitsverhouding. De individuele toewijzing per leningdeel vervalt.

3. Volledig eigenwoningverleden van beide partners mengt
Inclusief niet-toegepaste aflossingsstanden, resterende renteaftrekjaren en BEWS van beide partners. Dit is definitief en kan niet worden teruggedraaid.

4. Nieuw toetsmoment vereist — risico op box 3-verhuizing
De hypotheek dient opnieuw beoordeeld te worden om te voorkomen dat leningdelen naar box 3 verhuizen doordat de EWS-grenzen verschuiven.

Oplossing: huwelijkse voorwaarden (of partnerschapsvoorwaarden). Hierin kan de draagplichtovereenkomst worden doorverwezen of opgenomen. Dit is een notariële akte — tijdig te regelen, vóór het huwelijk.

Let op: vergoedingsrechten die zijn opgebouwd als samenwoners kunnen voor de helft verloren gaan als ze in de huwelijksgemeenschap vallen. Een anti-verjaringsbeding voorafgaand aan het huwelijk is dan extra belangrijk.`
    },
    {
      icon: "💳", titel: "Verplichte vs. extra aflossingen — vergoedingsrecht", kleur: C.orange,
      inhoud: `De draagplichtovereenkomst regelt wie de hypotheekschuld draagt, maar niet altijd wie wat betaalt. Bij aflossingen ontstaan vergoedingsrechten — maar alleen in bepaalde situaties.

Verplichte maandelijkse aflossing op een GEZAMENLIJK leningdeel:
→ GEEN automatisch vergoedingsrecht
Beide partners delen in de opgebouwde overwaarde, tenzij de meer-betalende partner het meerdere binnen 1 jaar na afloop van het kalenderjaar terugvordert. Daarna vervalt dit recht.

Extra (niet-verplichte) aflossing op een GEZAMENLIJK leningdeel:
→ WEL vergoedingsrecht
De meer-betalende partner heeft een vordering op de ander ter grootte van diens aandeel in de extra aflossing. Leg de opeisbaarheid vast (doorgaans bij verkoop).

Aflossing op een leningdeel waarvoor de ANDER draagplichtig is:
→ ALTIJD vergoedingsrecht
Dit is een directe betalingsverplichting die de ander overneemt. De vordering is onmiddellijk opeisbaar of bij verkoop, afhankelijk van de afspraken.

Waarderingsbasis:

• Proportioneel: naar rato waardestijging woning (bijv. inbreng €50.000 op €300.000 woning = 1/6 deel; bij waardestijging naar €450.000 = vordering €75.000)

Leg de keuze expliciet vast in de overeenkomst vergoedingsrechten. De notaris kan beide varianten passeren.`
    },

      inhoud: `De partnerregeling (art. 3.111 lid 8 Wet IB 2001) staat toe dat fiscale partners elkaars EWS-ruimte benutten onder bepaalde voorwaarden. Dit is relevant bij de maximale EWS-berekening per partner.

Standaard: elke partner heeft zijn/haar eigen maximale EWS op basis van eigen eigendomsaandeel, EWR en bijleenstand.

Partnerregeling: als fiscale partners kunnen zij kiezen om de woning als gezamenlijke eigen woning aan te merken, waarbij de EWS-ruimte gezamenlijk wordt beoordeeld. Dit kan voordelig zijn als één partner meer EWS-ruimte heeft dan de ander.

Voorwaarden voor de partnerregeling:
• Beide zijn het gehele jaar fiscale partners (art. 1.2 Wet IB 2001)
• De woning is de eigen woning van beiden (hoofdverblijf)
• Keuze wordt gemaakt in de aangifte inkomstenbelasting

Let op: bij een draagplichtovereenkomst kiest het paar bewust voor een individuele benadering, waarbij fiscale vermenging wordt uitgesloten. De partnerregeling en de draagplichtovereenkomst kunnen naast elkaar bestaan, maar de keuze dient bewust en gedocumenteerd te zijn.

Advies: bespreek de partnerregeling altijd met de adviseur en/of belastingadviseur wanneer er sprake is van asymmetrische EWS-ruimte.`
    },
    {
      icon: "🏛️", titel: "Wettelijk kader", kleur: C.gray,
      inhoud: `Artikel 6:10 BW (hoofdregel):
"Hoofdelijke schuldenaren zijn, ieder voor het gedeelte van de schuld dat hem in hun onderlinge verhouding aangaat, verplicht in de schuld bij te dragen."

De wet stelt gelijke draagplicht als standaard bij gezamenlijke schulden. Partners kunnen hier contractueel van afwijken — dat is precies wat de draagplichtovereenkomst doet.

Artikel 10bis.1 Wet IB 2001 (overgangsrecht):
Regelt de renteaftrek voor leningen die voor 1 januari 2013 zijn aangegaan. Lid 3 bevat de kan-bepaling voor gezamenlijke toepassing.

Bijleenregeling (art. 3.119a Wet IB 2001):
Verplichte inbreng van de eigenwoningreserve bij aankoop van een nieuwe eigen woning. Bepaalt de maximale eigenwoningschuld.

Tuchtrechtelijke aansprakelijkheid adviseur:
Het niet signaleren van de noodzaak tot een draagplichtovereenkomst kan leiden tot tuchtrechtelijke aansprakelijkheid als cliënten schade lijden door verlies van renteaftrek of financiële claims.`
    },
  ];

  return (
    <div>
      <div style={{ background: C.navy, borderRadius: 16, padding: 24, marginBottom: 24, display: "flex", alignItems: "center", gap: 18 }}>
        <div style={{ fontSize: 32 }}>📚</div>
        <div>
          <div style={{ color: C.goldLight, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.12em", fontFamily: fam.sans }}>Kennisbank</div>

          <div style={{ color: C.textLight, fontSize: 12.5, marginTop: 2, fontFamily: fam.sans }}>Juridisch, fiscaal en praktisch overzicht voor de hypotheekadviseur</div>

              <div onClick={() => setOpen(isOpen ? -1 : i)} style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 20px", cursor: "pointer", userSelect: "none" }}>

}

// SCENARIO BEREKENINGS-HULPFUNCTIES
// ═══════════════════════════════════════════════════════════════════

function euro(n) {
  if (!isFinite(n)) return "—";
  return "€\u00A0" + Math.round(n).toLocaleString("nl-NL") + ",-";
}

function pct(n) {
  if (!isFinite(n)) return "—";
  return n.toFixed(2) + "%";
}

function bereken(form, verkoopprijs, renteperc, belastingtarief) {
  const K  = (parseFloat(form?.aankoopprijs) || 0) + (parseFloat(form?.verwervingskosten) || 0);
  const H  = (form?.leningdelen || []).reduce((s, l) => s + (parseFloat(l.bedrag) || 0), 0);
  const E1 = (parseFloat(form?.eigendom1) || 50) / 100;
  const E2 = 1 - E1;
  const EV1 = parseFloat(form?.eigenVermogen1) || 0;
  const EV2 = parseFloat(form?.eigenVermogen2) || 0;
  const V   = parseFloat(verkoopprijs) || K * 1.15;
  const r   = parseFloat(renteperc) / 100;
  const t   = parseFloat(belastingtarief) / 100;

  const D1 = (form?.leningdelen || []).reduce((s, l) =>
    s + (parseFloat(l.bedrag) || 0) * (parseFloat(l.draag1) || 50) / 100, 0) || H * 0.5;
  const D2 = H - D1;

  const A = {
    draag1: H * 0.5, draag2: H * 0.5,
    opbrengst1: V * E1 - H * 0.5, opbrengst2: V * E2 - H * 0.5,
    // EWR = verkoopprijs × eigendomsaandeel − eigenwoningschuld (draagplicht)
    // Let op: EV NIET aftrekken — eigen inbreng zit al in de lagere draagplicht verdisconteerd.
    // Bestaande EWR uit vorige woning NIET opgeteld (zie toelichting).
    ewr1: Math.max(0, V * E1 - H * 0.5), ewr2: Math.max(0, V * E2 - H * 0.5),
    rente1: H * 0.5 * r, rente2: H * 0.5 * r,
    // Hypotheekrenteaftrek 2026: maximaal 37,56% (tariefmaatregel art. 2.10a Wet IB 2001); 35,75% bij inkomen in schijf 1.
    aftrek1: H * 0.5 * r * t, aftrek2: H * 0.5 * r * t,
  };

  const B = {
    draag1: D1, draag2: D2,
    opbrengst1: V * E1 - D1, opbrengst2: V * E2 - D2,
    ewr1: Math.max(0, V * E1 - D1), ewr2: Math.max(0, V * E2 - D2),
    rente1: D1 * r, rente2: D2 * r,
    aftrek1: D1 * r * t, aftrek2: D2 * r * t,
  };

  const diff1 = { draag: B.draag1-A.draag1, opbrengst: B.opbrengst1-A.opbrengst1, ewr: B.ewr1-A.ewr1, aftrek: B.aftrek1-A.aftrek1 };
  const diff2 = { draag: B.draag2-A.draag2, opbrengst: B.opbrengst2-A.opbrengst2, ewr: B.ewr2-A.ewr2, aftrek: B.aftrek2-A.aftrek2 };

  const eerlijk1 = Math.max(0, K * E1 - EV1);
  const eerlijk2 = Math.max(0, K * E2 - EV2);
  const schenkingAan1 = eerlijk1 > D1 ? eerlijk1 - D1 : 0;
  const schenkingAan2 = eerlijk2 > D2 ? eerlijk2 - D2 : 0;

  const VRIJSTELLING_JAARLIJKS = 6908; // 2026
  const SCHIJF1_GRENS = 158669; // tariefgrens schenkbelasting 2026
  function berekenSB(bedrag) {
    if (bedrag <= VRIJSTELLING_JAARLIJKS) return 0;
    const b = bedrag - VRIJSTELLING_JAARLIJKS;
    return b <= SCHIJF1_GRENS ? b * 0.10 : SCHIJF1_GRENS * 0.10 + (b - SCHIJF1_GRENS) * 0.20;
  }

  // Geen schenkbelasting tussen gehuwden/geregistreerd partnerschap (art. 33 lid 5 SW 1956)
  const geenSbTussenPartners = ["gehuwd_gemeen", "gehuwd_koude", "gehuwd_beperkt", "geregistreerd"]
    .includes(form?.relatievorm);

  const rechtvaardigingen = [];
  // Besluit Staatssecretaris van Financiën 30 januari 2018 (nr. 2018-3514):
  // draagplicht gebaseerd op EWV/BEWS/eigen inbreng wordt NIET als schenking aangemerkt.
  if ((form?.ewv1 || form?.ewv2) && (parseFloat(form?.bews1) > 0 || parseFloat(form?.bews2) > 0))
    rechtvaardigingen.push("BEWS-toewijzing o.b.v. overgangsrecht (art. 10bis.1 Wet IB 2001) — gedekt door Besluit 30-1-2018");
  if (Math.abs(EV1 - EV2) > 500)
    rechtvaardigingen.push(`Ongelijke inbreng eigen vermogen (€\u00A0${Math.round(Math.abs(EV1-EV2)).toLocaleString("nl-NL")} verschil) — gedekt door Besluit 30-1-2018`);
  if (Math.abs(E1 - 0.5) > 0.01)
    rechtvaardigingen.push(`Ongelijke eigendomsverdeling (${Math.round(E1*100)}/${Math.round(E2*100)}) — zakelijke grondslag`);
  if ((form?.ewv1 || false) !== (form?.ewv2 || false))
    rechtvaardigingen.push("Asymmetrisch eigenwoningverleden — renteaftrekjaren ongelijk, zakelijke grondslag");

  // Bestaande EWR uit vorige woning (cumulatief — telt op bij nieuwe EWR)
  const ewrOud1 = parseFloat(form?.ewr1 || 0);
  const ewrOud2 = parseFloat(form?.ewr2 || 0);

  // ── SCENARIO C: Individueel MÉT kan-bepaling (alleen als BEWS aanwezig) ──
  // Kan-bepaling: BEWS wordt naar rato schuldaandeel over beide partners verdeeld
  const bews1 = parseFloat(form?.bews1 || 0);
  const bews2 = parseFloat(form?.bews2 || 0);
  const heeftBEWS = bews1 > 0 || bews2 > 0;
  // Bij kan-bepaling: overgangsrecht-leningdelen worden naar rato verdeeld over totale schuld
  // Draagplicht wijzigt niet (dat is civiel), maar de BEWS wordt gezamenlijk toegepast
  // Fiscaal effect: renteaftrekjaren van partner MET bews gaan deels over op partner ZONDER bews
  const jaren1 = parseFloat(form?.jaren1 || 30);
  const jaren2 = parseFloat(form?.jaren2 || 30);
  // Gewogen resterende renteaftrekjaren bij kan-bepaling (naar rato schuldaandeel)
  const kanJaren1 = H > 0 ? (D1 / H * jaren1 + D2 / H * jaren2) : jaren1;
  const kanJaren2 = H > 0 ? (D1 / H * jaren1 + D2 / H * jaren2) : jaren2;
  // Indicatieve aftrek-impact: resterende jaren worden gedeeld
  const C_aftrek1 = D1 * r * t * (kanJaren1 / 30);
  const C_aftrek2 = D2 * r * t * (kanJaren2 / 30);

  const C_scenario = heeftBEWS ? {
    draag1: D1, draag2: D2,
    opbrengst1: V * E1 - D1, opbrengst2: V * E2 - D2,
    ewr1: Math.max(0, V * E1 - D1), ewr2: Math.max(0, V * E2 - D2),
    rente1: D1 * r, rente2: D2 * r,
    aftrek1: C_aftrek1, aftrek2: C_aftrek2,
    kanJaren1, kanJaren2,
  } : null;

  return { A, B, C: C_scenario, heeftBEWS, diff1, diff2, K, H, E1, E2, EV1, EV2, D1, D2, V,
    eerlijk1, eerlijk2, schenkingAan1, schenkingAan2,
    belasting1: geenSbTussenPartners ? 0 : berekenSB(schenkingAan1),
    belasting2: geenSbTussenPartners ? 0 : berekenSB(schenkingAan2),
    geenSbTussenPartners, ewrOud1, ewrOud2,
    rechtvaardigingen, VRIJSTELLING_JAARLIJKS };
}

const tdS = { padding: "10px 14px", fontSize: 13, fontFamily: "sans-serif", verticalAlign: "top" };

// SCHENKBELASTING CHECK
// ═══════════════════════════════════════════════════════════════════
function SchenkbelastingCheck({ calc, n1, n2 }) {
  const VRIJSTELLING = calc.VRIJSTELLING_JAARLIJKS;
  const heeft1 = !calc.geenSbTussenPartners && calc.schenkingAan1 > 100;
  const heeft2 = !calc.geenSbTussenPartners && calc.schenkingAan2 > 100;
  const heeftRisico = heeft1 || heeft2;
  const heeftRechtvaardiging = calc.rechtvaardigingen.length > 0;

  return (
    <div style={{ background: C.white, borderRadius: 14, boxShadow: "0 4px 20px rgba(11,31,58,.07)", padding: 24, marginBottom: 20 }}>
      <SectionH sub="Risico-analyse conform art. 1 lid 1 sub f Successiewet 1956 & Besluit 30-1-2018">Schenkbelasting risico-check</SectionH>

      {calc.geenSbTussenPartners ? (
        <div style={{ padding: "16px 20px", background: C.greenLight, borderRadius: 12, border: `1.5px solid ${C.green}`, marginBottom: 16 }}>
          <span style={{ fontWeight: 700, color: C.green, fontFamily: fam.sans }}>✓ Schenkbelasting niet van toepassing</span>
          <p style={{ margin: "6px 0 0", fontSize: 12.5, color: C.green, fontFamily: fam.sans }}>
            Schenkingen tussen echtgenoten en geregistreerde partners zijn vrijgesteld van schenkbelasting (art. 33 lid 5 Successiewet 1956). Een draagplichtovereenkomst leidt bij deze relatievorm niet tot schenkbelasting.
          </p>
        </div>
      ) : (
        <>
          <InfoBox type="info">
            <strong>Besluit Staatssecretaris van Financiën 30 januari 2018 (nr. 2018-3514):</strong> Een draagplichtovereenkomst die is gebaseerd op ongelijke inbreng van eigen vermogen of eigenwoningverleden wordt door de Belastingdienst <em>niet</em> als schenking aangemerkt. Afwijking zonder zakelijke grondslag kan wél schenkbelasting uitlokken (art. 1 lid 1 sub f SW 1956). De berekening hieronder is indicatief en beoordeelt het risico bij de huidige gegevens. De schenking crystalliseert eenmalig bij verkoop of overdracht van de woning — niet jaarlijks. Jaarlijkse vrijstelling 2026: € {VRIJSTELLING.toLocaleString("nl-NL")}.
          </InfoBox>

          <div className="scenario-table" style={{ overflowX: "auto", marginBottom: 20, WebkitOverflowScrolling: "touch" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, fontFamily: fam.sans }}>
              <thead>
                <tr style={{ background: C.navy }}>
                  {["", n1, n2].map(h => (
                    <th key={h} style={{ color: C.goldLight, padding: "9px 14px", textAlign: "left", fontSize: 11.5, textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 600 }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {[
                  ["Eigendomsaandeel", pct(calc.E1*100), pct(calc.E2*100)],
                  ["Eigen inbreng", euro(calc.EV1), euro(calc.EV2)],
                  ["'Eerlijke' draagplicht *", euro(calc.eerlijk1), euro(calc.eerlijk2)],
                  ["Werkelijke draagplicht (individueel)", euro(calc.D1), euro(calc.D2)],
                  ["Afwijking (+ = méér, − = minder)", euro(calc.D1-calc.eerlijk1), euro(calc.D2-calc.eerlijk2)],
                ].map(([l, v1, v2], i) => {
                  const isAfw = l.startsWith("Afwijking");
                  const afw1 = calc.D1-calc.eerlijk1, afw2 = calc.D2-calc.eerlijk2;
                  return (
                    <tr key={i} style={{ background: i%2===0 ? C.cream : C.white, borderBottom: isAfw ? `2px solid ${C.border}` : `1px solid ${C.grayMid}` }}>
                      <td style={{ ...tdS, fontWeight: isAfw?700:400, color: isAfw?C.navy:C.textMid }}>{l}</td>
                      <td style={{ ...tdS, fontWeight: isAfw?700:400, color: isAfw?(afw1<-100?C.green:afw1>100?C.red:C.gray):C.text }}>{v1}</td>
                      <td style={{ ...tdS, fontWeight: isAfw?700:400, color: isAfw?(afw2<-100?C.green:afw2>100?C.red:C.gray):C.text }}>{v2}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <div style={{ fontSize: 11, color: C.gray, marginTop: 6, fontFamily: fam.sans }}>
              * "Eerlijke draagplicht" = max(0, verwervingskosten × eigendomsaandeel − eigen inbreng). Het deel hypotheek dat een partner draagt als lasten zuiver naar rato eigendom en inbreng worden verdeeld. Afwijking met zakelijke grondslag is op grond van Besluit 30-1-2018 géén schenking.
            </div>
          </div>

          {heeftRisico ? (
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontWeight: 700, color: C.navy, fontSize: 14, marginBottom: 12, fontFamily: fam.sans }}>Mogelijke schenkingen gedetecteerd</div>
              <div className="rg2">
                {[
                  { naam: n1, schenking: calc.schenkingAan1, belasting: calc.belasting1, van: n2, heeft: heeft1 },
                  { naam: n2, schenking: calc.schenkingAan2, belasting: calc.belasting2, van: n1, heeft: heeft2 },
                ].map((p, i) => (
                  <div key={i} style={{ borderRadius: 12, border: `2px solid ${p.heeft ? C.red : C.border}`, overflow: "hidden" }}>
                    <div style={{ background: p.heeft ? C.redLight : C.grayLight, padding: "10px 14px" }}>
                      <span style={{ fontWeight: 700, fontSize: 13, color: p.heeft ? C.red : C.gray, fontFamily: fam.sans }}>
                        {p.heeft ? `⚠️ Schenking aan ${p.naam}` : `✓ ${p.naam} — geen risico`}
                      </span>
                    </div>
                    {p.heeft && (
                      <div style={{ padding: 14 }}>
                        <div style={{ fontSize: 12, color: C.textMid, fontFamily: fam.sans, marginBottom: 10 }}>
                          {p.van} draagt {euro(p.schenking)} méér dan zijn/haar eerlijk aandeel. Dit voordeel voor {p.naam} kan bij verkoop als eenmalige schenking worden aangemerkt (art. 1 lid 1 sub f SW 1956).
                        </div>
                        <div className="rg3" style={{ marginBottom: 10 }}>
                          {[["Schenkingsbedrag", euro(p.schenking)], ["Vrijstelling 2026", euro(VRIJSTELLING)], ["Belastbaar", euro(Math.max(0, p.schenking-VRIJSTELLING))]].map(([l, v]) => (
                            <div key={l} style={{ background: C.grayLight, borderRadius: 7, padding: "8px 10px" }}>
                              <div style={{ fontSize: 10, color: C.gray, textTransform: "uppercase", fontFamily: fam.sans }}>{l}</div>
                              <div style={{ fontWeight: 700, fontSize: 13, color: C.navy, fontFamily: fam.sans, marginTop: 2 }}>{v}</div>
                            </div>
                          ))}
                        </div>
                        {p.schenking > VRIJSTELLING && (
                          <div style={{ padding: "10px 12px", background: C.redLight, borderRadius: 8, borderLeft: `3px solid ${C.red}` }}>
                            <div style={{ fontSize: 12, fontWeight: 700, color: C.red, fontFamily: fam.sans }}>
                              Indicatieve schenkbelasting (eenmalig bij verkoop): {euro(p.belasting)}
                            </div>
                            <div style={{ fontSize: 11, color: "#7f1d1d", marginTop: 3, fontFamily: fam.sans }}>
                              Tarief: 10% over €{Math.min(p.schenking-VRIJSTELLING, 158669).toLocaleString("nl-NL")}
                              {p.schenking-VRIJSTELLING > 158669 ? ` + 20% over €${(p.schenking-VRIJSTELLING-158669).toLocaleString("nl-NL")},-` : ""}
                              {" "}(niet-familierelatie ongehuwd samenwoners)
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div style={{ padding: "16px 20px", background: C.greenLight, borderRadius: 12, border: `1.5px solid ${C.green}`, marginBottom: 16 }}>
              <span style={{ fontWeight: 700, color: C.green, fontFamily: fam.sans }}>✓ Geen schenkbelasting-risico gedetecteerd</span>
              <p style={{ margin: "6px 0 0", fontSize: 12.5, color: C.green, fontFamily: fam.sans }}>De werkelijke draagplicht is in lijn met eigendomsaandeel en eigen inbreng van beide partners.</p>
            </div>
          )}

          <div style={{ background: "#FFFBEB", border: `1.5px solid ${C.gold}`, borderRadius: 12, padding: 18 }}>
            <div style={{ fontWeight: 700, color: C.navy, fontSize: 13, marginBottom: 10, fontFamily: fam.sans }}>
              {heeftRechtvaardiging
                ? "✓ Zakelijke rechtvaardigingen aanwezig — Besluit 30-1-2018 van toepassing"
                : heeftRisico ? "⚠️ Geen zakelijke rechtvaardiging vastgesteld"
                : "Zakelijke rechtvaardiging — n.v.t."}
            </div>
            {heeftRechtvaardiging ? (
              <>
                <p style={{ margin: "0 0 10px", fontSize: 12.5, color: C.textMid, fontFamily: fam.sans }}>
                  Op grond van het Besluit van 30 januari 2018 (nr. 2018-3514) worden onderstaande factoren niet als schenking aangemerkt. Leg ze expliciet vast in de overeenkomst en het dossier:
                </p>
                {calc.rechtvaardigingen.map((r, i) => (
                  <div key={i} style={{ display: "flex", gap: 8, marginBottom: 6 }}>
                    <span style={{ color: C.green, fontWeight: 700 }}>✓</span>
                    <span style={{ fontSize: 12.5, color: C.text, fontFamily: fam.sans }}>{r}</span>
                  </div>
                ))}
                <div style={{ marginTop: 12, padding: "10px 14px", background: C.greenLight, borderRadius: 8 }}>
                  <span style={{ fontSize: 12, color: C.green, fontWeight: 600, fontFamily: fam.sans }}>Risiconiveau: Gemitigeerd — zakelijke rechtvaardiging gedekt door Besluit 30-1-2018. Leg dit vast in overeenkomst én dossier.</span>
                </div>
              </>
            ) : heeftRisico ? (
              <>
                <p style={{ margin: "0 0 10px", fontSize: 12.5, color: C.textMid, fontFamily: fam.sans }}>Er is een draagplichtafwijking zonder duidelijke zakelijke grondslag. Overweeg:</p>
                {[
                  "Leg de reden voor de afwijkende draagplicht expliciet vast in de overeenkomst",
                  "Bespreek met de notaris of de constructie schenkbelastingvrij kan worden ingericht",
                  "Controleer of de situatie valt onder het Besluit van 30 januari 2018 (nr. 2018-3514)",
                  "Pas de draagplicht aan zodat die overeenkomt met eigendom en inbreng",
                ].map((t, i) => (
                  <div key={i} style={{ display: "flex", gap: 8, marginBottom: 6 }}>
                    <span style={{ color: C.orange }}>→</span>
                    <span style={{ fontSize: 12.5, color: C.text, fontFamily: fam.sans }}>{t}</span>
                  </div>
                ))}
              </>
            ) : (
              <p style={{ margin: 0, fontSize: 12.5, color: C.textMid, fontFamily: fam.sans }}>Er is geen schenkbelasting-risico — een zakelijke rechtvaardiging is niet vereist.</p>
            )}
          </div>
        </>
      )}
    </div>
  );
}

// SCENARIO VERGELIJKING TAB
// ═══════════════════════════════════════════════════════════════════
function ScenarioVergelijkingTab({ form }) {
  const K = (parseFloat(form?.aankoopprijs) || 0) + (parseFloat(form?.verwervingskosten) || 0);
  const [verkoopprijs, setVerkoopprijs] = useState(String(Math.round(K * 1.15) || ""));
  const [renteperc, setRenteperc] = useState("4.0");
  const [belastingtarief, setBelastingtarief] = useState("37.56");
  const [actieveKolom, setActieveKolom] = useState("opbrengst");

  const n1 = form?.naam1 || "Aanvrager";
  const n2 = form?.naam2 || "Partner";
  const calc = bereken(form, verkoopprijs, renteperc, belastingtarief);
  const heeftData = calc.H > 0 && K > 0;

  const Vbase = parseFloat(verkoopprijs) || K * 1.15;
  const scenarios_vp = [
    { label: "−15% (daling)", V: Vbase * 0.85 },
    { label: "Ingevoerde prijs", V: Vbase },
    { label: "+15% (stijging)", V: Vbase * 1.15 },
    { label: "+30% (stijging)", V: Vbase * 1.30 },
  ];

  const KOLOMMEN = [
    { id: "opbrengst", label: "Netto opbrengst bij verkoop", hint: "Eigendomswaarde (verkoopprijs × eigendomsaandeel) minus resterende hypotheekschuld (draagplicht). Eigen inbreng zit in de lagere draagplicht verdisconteerd." },
    { id: "ewr", label: "Nieuwe EWR (deze woning)", hint: "Eigenwoningreserve = verkoopprijs × eigendomsaandeel − draagplicht. Indicatief — bestaande EWR uit vorige woning en verkoopkosten niet meegerekend. Zie bijleenregeling (art. 3.119aa Wet IB 2001)." },
    { id: "aftrek", label: "Jaarlijkse renteaftrek", hint: "Renteaftrek = draagplicht × rente × gekozen aftrektarief (2026: maximaal 37,56%, art. 2.10a Wet IB 2001). Gebaseerd op initieel leningbedrag." },
  ];

  function getVal(scenario, partner, kolom) {
    if (kolom === "opbrengst") return partner === 1 ? scenario.opbrengst1 : scenario.opbrengst2;
    if (kolom === "ewr")       return partner === 1 ? scenario.ewr1       : scenario.ewr2;
    if (kolom === "aftrek")    return partner === 1 ? scenario.aftrek1    : scenario.aftrek2;
    return 0;
  }

  function diffTeken(v) {
    if (Math.abs(v) < 50) return <span style={{ color: C.gray }}>≈ 0</span>;
    return <span style={{ color: v > 0 ? C.green : C.red, fontWeight: 700 }}>{(v > 0 ? "+" : "") + euro(v)}</span>;
  }

  function TableRow({ vpObj }) {
    const c = bereken(form, String(vpObj.V), renteperc, belastingtarief);
    const d1 = getVal(c.B, 1, actieveKolom) - getVal(c.A, 1, actieveKolom);
    const d2 = getVal(c.B, 2, actieveKolom) - getVal(c.A, 2, actieveKolom);
    return (
      <tr style={{ borderBottom: `1px solid ${C.border}` }}>
        <td style={tdS}>{vpObj.label}<br/><span style={{ fontSize: 11, color: C.gray }}>€ {Math.round(vpObj.V).toLocaleString("nl-NL")}</span></td>
        <td style={{ ...tdS, color: C.textMid }}>{euro(getVal(c.A, 1, actieveKolom))}</td>
        <td style={{ ...tdS, color: C.textMid }}>{euro(getVal(c.A, 2, actieveKolom))}</td>
        <td style={{ ...tdS, fontWeight: 700, color: C.green }}>{euro(getVal(c.B, 1, actieveKolom))}</td>
        <td style={{ ...tdS, fontWeight: 700, color: C.green }}>{euro(getVal(c.B, 2, actieveKolom))}</td>
        {c.heeftBEWS && c.C && <td style={{ ...tdS, fontWeight: 700, color: "#7C3AED" }}>{euro(getVal(c.C, 1, actieveKolom))}</td>}
        {c.heeftBEWS && c.C && <td style={{ ...tdS, fontWeight: 700, color: "#7C3AED" }}>{euro(getVal(c.C, 2, actieveKolom))}</td>}
        <td style={tdS}>{diffTeken(d1)}</td>
        <td style={tdS}>{diffTeken(d2)}</td>
      </tr>
    );
  }

          ) : (
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18, flexWrap: "wrap", gap: 8 }}>
                <h2 style={{ margin: 0, color: C.navy, fontSize: 20, fontFamily: fam.serif }}>Adviesresultaat</h2>
                <div style={{ display: "flex", gap: 8 }} className="no-print">
                  <button style={btnSm} onClick={() => window.print()} title="Afdrukken">🖨️ Afdrukken</button>
                  <button style={btnSecondary} onClick={reset}>← Nieuwe analyse</button>
                </div>
              </div>
              <ResultaatPanel form={form} advies={advies} setTab={setTab} />
            </div>
          )
        )}

        {tab === 2 && <AdviesrapportTab form={form} />}
        {tab === 3 && <DocumentenTab form={form} />}
        {tab === 4 && <DossierTab />}
        {tab === 5 && <ScenarioVergelijkingTab form={form} />}
        {tab === 6 && <KennisbankTab />}
      </div>
    </div>
  );
}

    // Render de applicatie
    const container = document.getElementById('root');
    const reactRoot = ReactDOM.createRoot(container);
    reactRoot.render(<App />);

    // Verberg het laadscherm zodra React de DOM heeft bijgewerkt
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.classList.add('fade-out');
          setTimeout(() => { loading.style.display = 'none'; }, 450);
        }
      });
    });
  </script>

</body>
</html>
